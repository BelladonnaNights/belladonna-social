*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f8f6f2;--bg3:#ede9e2;--text:#1a1714;--text2:#6b6460;--text3:#a09890;

  --gold-dim:rgba(201,168,76,.12);--gold-border:rgba(201,168,76,.4);
  --red:#b3382c;--green:#3b7a2a;

}
html,body{min-height:100%;font-family:var(--font);background:var(--bg2);color:var(--text);}
.nav{background:var(--bg);border-bottom:1px solid var(--border2);padding:0 1.25rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;height:52px;}
.brand{font-family:var(--cinzel);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;flex-shrink:0;}
.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:17px 12px;font-size:10px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;font-family:var(--cinzel);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600;}
.mode{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:.5px solid var(--border2);color:var(--text3);white-space:nowrap;flex-shrink:0;}
.mode.cloud{color:var(--green);border-color:var(--green);}
.mode.local{color:#8a5a00;border-color:#c98a00;}
.btn{cursor:pointer;font-family:var(--font);font-size:12px;border-radius:var(--r);padding:7px 14px;border:none;white-space:nowrap;}
.btn-p{background:var(--text);color:#fff;font-weight:500;}
.btn-p:hover{opacity:.82}
.btn-g{background:none;border:.5px solid var(--border2);color:var(--text2);}
.btn-g:hover{background:var(--bg3);color:var(--text)}
.btn-d{background:none;border:.5px solid var(--red);color:var(--red);}
.btn-gold{background:none;border:.5px solid var(--gold);color:#8a6a10;}
.btn-gold:hover{background:var(--gold-dim)}
.wrap{max-width:980px;margin:0 auto;padding:1.25rem 1rem 4rem;}
.title{font-family:var(--cinzel);font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text2);margin:2px 0 14px;}
.banner{background:#fff8e1;border:.5px solid var(--gold-border);border-radius:var(--rl);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.banner.err{background:#fdecea;border-color:var(--red);}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.stat{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:8px 14px;min-width:96px;}
.stat b{display:block;font-family:var(--cinzel);font-size:18px;font-weight:600;}
.stat span{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.stat.bad b{color:var(--red)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.chip{padding:4px 12px;border-radius:99px;font-size:10px;border:.5px solid var(--border2);background:none;cursor:pointer;color:var(--text2);font-family:var(--cinzel);letter-spacing:.04em;text-transform:uppercase;}
.chip.on{background:var(--text);color:#fff;border-color:var(--text);}
select,input[type=text],input[type=date],input[type=time],textarea{font-family:var(--font);font-size:13px;padding:7px 10px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);width:100%;}
select.mini{width:auto;font-size:12px;padding:5px 8px;}
textarea{resize:vertical;min-height:90px;line-height:1.5;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);}
.sec{font-family:var(--cinzel);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px;color:var(--text2);}
.day{margin-bottom:14px;}
.dayh{font-family:var(--cinzel);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:4px 2px;border-bottom:.5px solid var(--border);margin-bottom:5px;display:flex;gap:8px;align-items:center;}
.dayh .tag{font-size:8px;padding:1px 7px;border-radius:99px;letter-spacing:.06em;}
.dayh .today{background:var(--gold);color:#1a1714}
.dayh .od{background:#fdecea;color:var(--red)}
.monthh{font-family:var(--cinzel);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border2);}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);margin-bottom:4px;cursor:pointer;}
.row:hover{border-color:var(--gold-border)}
.row.done{opacity:.55}
.row.milestone{background:var(--gold-dim);border-color:var(--gold-border)}
.ck{display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--cinzel);font-size:7px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);width:42px;flex-shrink:0;}

.time{font-family:var(--cinzel);font-size:10px;color:var(--text3);width:52px;flex-shrink:0;}
.badge{font-size:9px;font-weight:500;padding:1px 8px;border-radius:99px;font-family:var(--cinzel);letter-spacing:.03em;white-space:nowrap;flex-shrink:0;border:.5px solid currentColor;}
.rt{flex:1;min-width:0;font-size:13px;font-weight:500;}
.rt small{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:12px;color:var(--text3);}
.has{font-size:10px;color:var(--text3);flex-shrink:0;font-family:var(--cinzel)}
.empty{font-family:var(--serif);font-style:italic;color:var(--text3);padding:1.5rem 0;text-align:center;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:14px;}

.card .meta{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--text2);margin-bottom:8px;}
.card .lbl{display:block;font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:8px 0 3px;}
.prog{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden;margin:6px 0;}
.prog i{display:block;height:100%;background:var(--gold-shine);}
.prog.posted i{background:var(--green);}
.nick{font-family:var(--cinzel);font-size:9px;letter-spacing:.06em;color:var(--gold);text-transform:uppercase;}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:1rem;}
.ov.show{display:flex}

.checks input{width:17px;height:17px;accent-color:#c9a84c}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.sp{flex:1}
.tools{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}

.toast.show{transform:translateX(-50%) translateY(0)}

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function buildSeed(){
  const out=[];
  SEED.trim().split('\n').forEach(line=>{
    const m=line.trim().match(/^(\d{4}-\d{2}-\d{2})\s+([A-Z0-9]+)(?:@(\d{2}:\d{2})?)?\s*(.*)$/);
    if(!m)return;
    const [,date,code,atTime,rest]=m;
    const hasAt=line.includes('@');
    let type,title,time;
    switch(code){
      case 'W':type='weekly';title='Weekly graphic: '+rest;time='11:00';break;
      case 'N':type='weekly';title='Weekly nights graphic (no costume theme)';time='11:00';break;
      case 'M':type='monthly';title='Monthly announcement, 2 slides: '+rest;time='12:00';break;
      case 'C':type='cover';title='Facebook Event: '+rest;time='12:00';break;
      case 'K7':type='count';title='Countdown, 7 days: '+rest;time='12:00';break;
      case 'K3':type='count';title='Countdown, 3 days: '+rest;time='12:00';break;
      case 'K0':type='count';title='Countdown, day of: '+rest;time='12:00';break;
      case 'R':type='recap';title='Monthly recap: '+rest;time='12:00';break;
      case 'B':type='big';title='Big night: '+rest;time='';break;
      default:return;
    }
    if(hasAt)time=atTime||'';
    out.push({id:`s_${date}_${code}_${slug(rest||'nights')}`,date,time,type,title,
      platform:TYPES[type].plat,caption:'',imageUrl:'',notes:'',created:false,posted:false});
  });
  return out;
}

/* ── STATE ── */
let db=null,fs=null,mode='local',posts=[],libOv={};
let tab=(location.hash||'#dashboard').slice(1);
let calView='todo',typeF='all',monthF='all',studioF='caption',editingId=null;
const TABS=[['dashboard','Dashboard'],['calendar','Calendar'],['campaigns','Campaigns'],['studio','Studio'],['echo','Echo'],['library','Library']];
if(!TABS.some(t=>t[0]===tab))tab='dashboard';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function todayStr(){return ymd(new Date());}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function banner(html,err){$('banner').innerHTML=html?`<div class="banner${err?' err':''}">${html}</div>`:'';}
const isMile=p=>TYPES[p.type]?.milestone;
const overdue=(p,t)=>!isMile(p)&&!p.posted&&p.date<t;
function monthName(m){return new Date(m+'-15T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function dayName(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
function fmtTime(t){if(!t)return '';const[h,m]=t.split(':').map(Number);return `${((h+11)%12)+1}:${pad(m)} ${h<12?'am':'pm'}`;}
const sortFn=(a,b)=>(a.date+(a.time||'99'))<(b.date+(b.time||'99'))?-1:1;

/* ── STORAGE ── */
async function init(){
  if(!FIREBASE_CONFIG.apiKey.startsWith('PASTE')){
    try{
      const app=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      fs=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      db=fs.getFirestore(app.initializeApp(FIREBASE_CONFIG));
      mode='cloud';
      const bad=err=>banner('Firestore says: '+esc(err.message)+'. The rules need entries for <b>'+COL_POSTS+'</b> and <b>'+COL_LIB+'</b>.',true);
      fs.onSnapshot(fs.collection(db,COL_POSTS),snap=>{posts=snap.docs.map(d=>({id:d.id,...d.data()}));render();},bad);
      fs.onSnapshot(fs.collection(db,COL_LIB),snap=>{libOv={};snap.docs.forEach(d=>libOv[d.id]=d.data());render();},bad);
    }catch(e){mode='local';banner('Firebase failed to load ('+esc(e.message)+'). Running in this-browser-only mode.',true);}
  }
  if(mode==='local'){
    posts=JSON.parse(localStorage.getItem(LS)||'[]');
    libOv=JSON.parse(localStorage.getItem(LS_LIB)||'{}');
  }
  const m=$('mode');
  m.textContent=mode==='cloud'?'Synced · belladonna-hq':'This browser only';
  m.className='mode '+(mode==='cloud'?'cloud':'local');
  render();
}
async function persist(p){
  const i=posts.findIndex(x=>x.id===p.id);
  if(i>=0)posts[i]=p;else posts.push(p);
  if(mode==='cloud'){const{id,...rest}=p;await fs.setDoc(fs.doc(db,COL_POSTS,id),rest);}
  else localStorage.setItem(LS,JSON.stringify(posts));
  render();
}
async function removePost(id){
  posts=posts.filter(p=>p.id!==id);
  if(mode==='cloud')await fs.deleteDoc(fs.doc(db,COL_POSTS,id));
  else localStorage.setItem(LS,JSON.stringify(posts));
  render();
}
async function saveLib(id,patch){
  libOv[id]={...(libOv[id]||{}),...patch};
  if(mode==='cloud')await fs.setDoc(fs.doc(db,COL_LIB,id),libOv[id]);
  else localStorage.setItem(LS_LIB,JSON.stringify(libOv));
  toast('Saved');
}
async function seedMissing(){
  const have=new Set(posts.map(p=>p.id));
  const add=buildSeed().filter(s=>!have.has(s.id));
  if(!add.length){toast('Nothing missing');return;}
  if(mode==='cloud'){
    for(let i=0;i<add.length;i+=400){
      const b=fs.writeBatch(db);
      add.slice(i,i+400).forEach(({id,...rest})=>b.set(fs.doc(db,COL_POSTS,id),rest));
      await b.commit();
    }
  }else{
    posts=posts.concat(add);
    localStorage.setItem(LS,JSON.stringify(posts));
    render();
  }
  toast(add.length+' posts added');
}

/* ── SHELL ── */
function setTab(t){tab=t;location.hash=t;render();window.scrollTo(0,0);}
function render(){
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-act="tab" data-arg="${k}">${l}</button>`).join('');
  if(!posts.length)banner(`Clio's calendar is empty. <button class="btn btn-p" data-act="seed">Load my 2026–2027 calendars (${buildSeed().length} rows)</button>`);
  else if($('banner').querySelector('.banner:not(.err)'))banner('');
  ({dashboard:vDashboard,calendar:vCalendar,campaigns:vCampaigns,studio:vStudio,echo:vEcho,library:vLibrary})[tab]();
}
function head(t,s){return `<div class="title">${t}</div><div class="sub">${s}</div>`;}

/* ── ROWS ── */
function rowHtml(p){
  const T=TYPES[p.type]||TYPES.other,mile=isMile(p);
  const checks=mile?'<div class="ck" style="visibility:hidden"></div>':
    `<div class="ck"><input type="checkbox" data-k="created" ${p.created?'checked':''}/>Made</div><div class="ck"><input type="checkbox" data-k="posted" ${p.posted?'checked':''}/>Posted</div>`;
  const has=(p.caption?'✎ ':'')+(p.imageUrl?'🖼':'');
  return `<div class="row ${mile?'milestone':''} ${p.posted?'done':''}" data-id="${esc(p.id)}">${checks}<div class="time">${fmtTime(p.time)||'—'}</div><span class="badge" style="background:${T.bg};color:${T.c}">${T.l}</span><div class="rt">${esc(p.title)}${p.notes?`<small>${esc(p.notes)}</small>`:''}</div><div class="has">${has}</div></div>`;
}
function groupedList(list,monthHeads,desc){
  if(!list.length)return '<div class="empty">Nothing here.</div>';
  const t=todayStr();let html='',curM='',curD='';
  list.forEach(p=>{
    const m=p.date.slice(0,7);
    if(monthHeads&&m!==curM){curM=m;html+=(curD?'</div>':'')+`<div class="monthh">${monthName(m)}</div>`;curD='';}
    if(p.date!==curD){
      if(curD)html+='</div>';
      curD=p.date;
      const tag=p.date===t?'<span class="tag today">Today</span>':(p.date<t&&list.some(x=>x.date===p.date&&overdue(x,t))?'<span class="tag od">Overdue</span>':'');
      html+=`<div class="day"><div class="dayh">${dayName(p.date)} ${tag}</div>`;
    }
    html+=rowHtml(p);
  });
  return html+'</div>';
}
function statsHtml(list,t){
  const real=list.filter(p=>!isMile(p));
  return `<div class="stats"><div class="stat"><b>${real.length}</b><span>Showing</span></div><div class="stat"><b>${real.filter(p=>p.created).length}</b><span>Made</span></div><div class="stat"><b>${real.filter(p=>p.posted).length}</b><span>Posted</span></div><div class="stat ${posts.some(p=>overdue(p,t))?'bad':''}"><b>${posts.filter(p=>overdue(p,t)).length}</b><span>Overdue (all)</span></div></div>`;
}

/* ── DASHBOARD ── */
function vDashboard(){
  const t=todayStr(),wk=addDays(t,7);
  const real=posts.filter(p=>!isMile(p));
  const od=real.filter(p=>overdue(p,t)).sort(sortFn);
  const next=real.filter(p=>p.date>=t&&p.date<=wk&&!p.posted).sort(sortFn);
  const needMade=next.filter(p=>!p.created).length;
  const bigs=posts.filter(p=>p.type==='big'&&p.date>=t).sort(sortFn).slice(0,3);
  const thisMonth=t.slice(0,7),mp=real.filter(p=>p.date.startsWith(thisMonth));
  $('view').innerHTML=head('Dashboard','What needs you right now.')+
    `<div class="stats">
      <div class="stat ${od.length?'bad':''}"><b>${od.length}</b><span>Overdue</span></div>
      <div class="stat"><b>${next.length}</b><span>Next 7 days</span></div>
      <div class="stat"><b>${needMade}</b><span>Still to make</span></div>
      <div class="stat"><b>${mp.filter(p=>p.posted).length}/${mp.length}</b><span>Posted this month</span></div>
    </div>`+
    (bigs.length?`<div class="sec">Next big nights</div>`+bigs.map(rowHtml).join(''):'')+
    `<div class="sec">Overdue</div>`+(od.length?od.slice(0,8).map(rowHtml).join('')+(od.length>8?`<div class="empty"><button class="btn btn-g" data-act="view" data-arg="overdue">See all ${od.length} overdue</button></div>`:''):'<div class="empty">Nothing overdue.</div>')+
    `<div class="sec">Next 7 days</div>`+(next.length?groupedList(next,false):'<div class="empty">Nothing due this week.</div>');
}

/* ── CALENDAR (History lives here) ── */
function vCalendar(){
  const t=todayStr();
  const months=[...new Set(posts.map(p=>p.date.slice(0,7)))].sort();
  const views=[['todo','To do'],['overdue','Overdue'],['all','Everything'],['history','History']];
  let list=posts.slice();
  if(typeF!=='all')list=list.filter(p=>p.type===typeF);
  if(monthF!=='all')list=list.filter(p=>p.date.startsWith(monthF));
  const end=addDays(t,14);
  if(calView==='todo')list=list.filter(p=>overdue(p,t)||(p.date>=t&&p.date<=end&&!p.posted));
  if(calView==='overdue')list=list.filter(p=>overdue(p,t));
  if(calView==='history')list=list.filter(p=>p.posted);
  list.sort(sortFn);
  if(calView==='history')list.reverse();
  $('view').innerHTML=head('Calendar',calView==='history'?'Everything that has gone out.':'Check “Made” when the graphic exists, “Posted” when it is live.')+
    statsHtml(list,t)+
    `<div class="bar">${views.map(([k,l])=>`<button class="chip ${calView===k?'on':''}" data-act="view" data-arg="${k}">${l}</button>`).join('')}
      <select class="mini" id="tf"><option value="all">All templates</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${typeF===k?'selected':''}>${v.l}</option>`).join('')}</select>
      <select class="mini" id="mf"><option value="all">All months</option>${months.map(m=>`<option value="${m}" ${monthF===m?'selected':''}>${monthName(m)}</option>`).join('')}</select></div>`+
    (calView==='todo'?groupedList(list,false):groupedList(list,calView!=='history'));
}

  const real=posts.filter(p=>!isMile(p));

    `<div class="grid">${months.map(m=>{

/* ── STUDIO: where posts get finished ── */
function vStudio(){
  const t=todayStr();

/* ── EVENTS ── */
$('view').addEventListener('click',e=>{
  const cb=e.target.closest('input[data-k]');
  if(cb){
    const row=cb.closest('.row'),p=posts.find(x=>x.id===row.dataset.id);if(!p)return;
    const k=cb.dataset.k,v=cb.checked,n={...p,[k]:v};
    if(k==='posted'&&v)n.created=true;
    if(k==='created'&&!v)n.posted=false;
    persist(n);return;
  }
  const a=e.target.closest('[data-act]');
  if(a){act(a.dataset.act,a.dataset.arg);return;}
  const row=e.target.closest('.row');
  if(row)openEdit(row.dataset.id);
});
$('tabs').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)act(a.dataset.act,a.dataset.arg);});
document.querySelector('.nav').addEventListener('click',e=>{const a=e.target.closest('[data-act="new"]');if(a)openEdit();});
$('banner').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)act(a.dataset.act,a.dataset.arg);});
$('view').addEventListener('change',e=>{
  if(e.target.id==='tf'){typeF=e.target.value;render();}
  else if(e.target.id==='mf'){monthF=e.target.value;render();}
  else if(e.target.dataset.lib)saveLib(e.target.dataset.lib,{[e.target.dataset.f]:e.target.value.trim()}).then(render);
});
function act(a,arg){
  if(a==='tab')setTab(arg);
  else if(a==='view'){calView=arg;if(tab!=='calendar')tab='calendar';render();}
  else if(a==='seed')seedMissing();
  else if(a==='export')exportBuffer();
  else if(a==='month'){monthF=arg;calView='all';setTab('calendar');}
  else if(a==='studio'){studioF=arg;render();}
  else if(a==='new')openEdit();
}

/* ── EDIT MODAL ── */
$('f-type').innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('');

/* The Muse: builds the ChatGPT prompt for this post from your template text */
const STYLE='Style: dark gothic botanical, near-black background, antique gold and cream accents, deadly nightshade sprigs framing the corners, a raven perched at the top. Elegant serif display font for the title, clean sans-serif for details. No emojis, no clip art, no cheesy party elements.';
function museFor(type,title){
  const t=title.includes(': ')?title.split(': ').slice(1).join(': '):title;
  const ev=t.replace(/^\d+ days?: /,'');
  if(type==='monthly')return `Create a 1080x1350 Instagram graphic for a live entertainment brand called Belladonna. ${STYLE}\n\nLayout, top to bottom:\n1. Small gold line: "BELLADONNA PRESENTS"\n2. Huge title: "[MONTH NAME]"\n3. Subtitle: "${t}"\n4. Four lines, one per week, each with the date and costume theme: "[Mon DATE] [WEEK 1 THEME]", and so on for weeks 2 to 4\n5. A gold highlighted line: "BIG NIGHT: [EVENT NAME], [DAY, DATE]"\n6. Bottom line: "Dress in the theme. Or any costume. Bonus card for everyone who does."\n7. Small footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD]. Keep the text large and perfectly spelled.`;
  if(type==='weekly')return `Create a 1080x1350 Instagram graphic for Belladonna, a live entertainment brand. ${STYLE}\n\nLayout:\n1. Small gold line: "THIS WEEK AT BELLADONNA"\n2. Huge title: "${t.toUpperCase()}"\n3. One line under it: "[WEEK X OF 4: MONTH THEME NAME]"\n4. A list of this week's nights, one per line: "[DAY], [VENUE], [EVENT]"\n5. Gold line: "Costume = bonus card. Theme costume = bonus stamp."\n6. Small footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD].`;
  if(type==='count'){
    const m=title.match(/^Countdown, (.*?): (.*)$/);
    const when=m?(m[1]==='day of'?'TONIGHT':m[1].toUpperCase()):'[N DAYS]';
    return `Create a 1080x1350 Instagram graphic for Belladonna, a live entertainment brand. ${STYLE}\n\nLayout:\n1. Small gold line: "BELLADONNA COUNTDOWN"\n2. Huge title: "${when}"\n3. Event name: "${m?m[2]:ev}"\n4. Details: "[DAY, DATE] · [TIME] · [VENUE]"\n5. Gold line: "Dress in the theme. Or any costume."\n6. Small footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD].`;
  }
  if(type==='cover')return `Create a 1920x1005 Facebook Event cover for Belladonna, a live entertainment brand. ${STYLE}\n\nText, large and centered with a clear safe margin:\n1. Small gold line: "BELLADONNA PRESENTS"\n2. Huge title: "${ev.toUpperCase()}"\n3. Details: "[DAY, DATE] · [TIME] · [VENUE]"\n4. Small line: "Dress in the theme. Or any costume."\n\nMood: [ONE LINE OF MOOD].`;
  if(type==='recap')return `Create a 1080x1350 Instagram graphic for Belladonna, a live entertainment brand. ${STYLE}\n\nLayout:\n1. Small gold line: "BELLADONNA RECAP"\n2. Huge title: "${t.toUpperCase()}"\n3. Subtitle: "CROWN WINNERS"\n4. Winner names, one per line: "[WEEK 1 WINNER]" to "[FINALE WINNER]"\n5. Empty framed area for a photo collage\n6. Gold line: "Next month: [NEXT MONTH THEME]"\n7. Small footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD].`;
  return `Create a graphic for Belladonna, a live entertainment brand, for this post: "${title}". ${STYLE}\n\nText: "[TEXT]". Footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD].`;
}
function muse(){
  const p=museFor($('f-type').value,$('f-title').value||'');
  $('f-muse').value=p;$('f-muse-wrap').style.display='';
  (navigator.clipboard?navigator.clipboard.writeText(p).then(()=>toast('Prompt copied'),()=>toast('Select and copy the prompt below')):Promise.resolve(toast('Select and copy the prompt below')));
}

/* ── BUFFER CSV EXPORT (Buffer's bulk upload: Text, Image URL, Tags, Posting Time) ── */
function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"';}
function exportBuffer(){
  const t=todayStr();
  let list=posts.filter(p=>!isMile(p)&&!p.posted&&p.date>=t);
  const ready=list.filter(p=>p.caption.trim()).sort(sortFn);
  const skipped=list.length-ready.length;
  if(!ready.length){toast('No upcoming posts have a caption yet');return;}
  const rows=[['Text','Image URL','Tags','Posting Time'].map(csvCell).join(',')];
  ready.forEach(p=>rows.push([p.caption,p.imageUrl,'',`${p.date} ${p.time||'12:00'}`].map(csvCell).join(',')));
  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='clio-buffer-'+t+'.csv';document.body.appendChild(a);a.click();a.remove();
  toast(ready.length+' posts exported'+(skipped?` · ${skipped} skipped (no caption)`:''));
}

window.closeEdit=closeEdit;window.saveEdit=saveEdit;window.delPost=delPost;window.encore=encore;window.muse=muse;
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==tab){tab=h;render();}});
init();
