<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f8f6f2;--bg3:#ede9e2;--text:#1a1714;--text2:#6b6460;--text3:#a09890;
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
  --gold:#c9a84c;--gold-shine:linear-gradient(135deg,#c9a84c 0%,#f5df90 45%,#c9a84c 70%,#e2b84a 100%);
  --gold-dim:rgba(201,168,76,.12);--gold-border:rgba(201,168,76,.4);
  --red:#b3382c;--green:#3b7a2a;
  --r:8px;--rl:12px;--font:'DM Sans',sans-serif;--cinzel:'Cinzel',serif;--serif:'EB Garamond',serif;
}
html,body{min-height:100%;font-family:var(--font);background:var(--bg2);color:var(--text);}
.nav{background:var(--bg);border-bottom:1px solid var(--border2);padding:0 1.25rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;height:52px;}
.brand{font-family:var(--cinzel);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;}
.mode{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:.5px solid var(--border2);color:var(--text3);}
.mode.cloud{color:var(--green);border-color:var(--green);}
.mode.local{color:#8a5a00;border-color:#c98a00;}
.sp{flex:1}
.btn{cursor:pointer;font-family:var(--font);font-size:12px;border-radius:var(--r);padding:7px 14px;border:none;white-space:nowrap;}
.btn-p{background:var(--text);color:#fff;font-weight:500;}
.btn-p:hover{opacity:.82}
.btn-g{background:none;border:.5px solid var(--border2);color:var(--text2);}
.btn-g:hover{background:var(--bg3);color:var(--text)}
.btn-d{background:none;border:.5px solid var(--red);color:var(--red);}
.wrap{max-width:980px;margin:0 auto;padding:1.25rem 1rem 4rem;}
.title{font-family:var(--cinzel);font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text2);margin:2px 0 14px;}
.banner{background:#fff8e1;border:.5px solid var(--gold-border);border-radius:var(--rl);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.banner.err{background:#fdecea;border-color:var(--red);}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.stat{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:8px 14px;min-width:96px;}
.stat b{display:block;font-family:var(--cinzel);font-size:18px;font-weight:600;}
.stat span{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.stat.bad b{color:var(--red)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.chip{padding:4px 12px;border-radius:99px;font-size:10px;border:.5px solid var(--border2);background:none;cursor:pointer;color:var(--text2);font-family:var(--cinzel);letter-spacing:.04em;text-transform:uppercase;}
.chip.on{background:var(--text);color:#fff;border-color:var(--text);}
select,input[type=text],input[type=date],input[type=time],textarea{font-family:var(--font);font-size:13px;padding:7px 10px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);width:100%;}
select.mini{width:auto;font-size:12px;padding:5px 8px;}
textarea{resize:vertical;min-height:90px;line-height:1.5;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);}
.day{margin-bottom:14px;}
.dayh{font-family:var(--cinzel);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:4px 2px;border-bottom:.5px solid var(--border);margin-bottom:5px;display:flex;gap:8px;align-items:center;}
.dayh .tag{font-size:8px;padding:1px 7px;border-radius:99px;letter-spacing:.06em;}
.dayh .today{background:var(--gold);color:#1a1714}
.dayh .od{background:#fdecea;color:var(--red)}
.monthh{font-family:var(--cinzel);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border2);}

.row:hover{border-color:var(--gold-border)}
.row.done{opacity:.55}
.row.milestone{background:var(--gold-dim);border-color:var(--gold-border);cursor:pointer}
.ck{display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--cinzel);font-size:7px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);width:42px;flex-shrink:0;}

.time{font-family:var(--cinzel);font-size:10px;color:var(--text3);width:52px;flex-shrink:0;}
.badge{font-size:9px;font-weight:500;padding:1px 8px;border-radius:99px;font-family:var(--cinzel);letter-spacing:.03em;white-space:nowrap;flex-shrink:0;border:.5px solid currentColor;}
.rt{flex:1;min-width:0;font-size:13px;font-weight:500;}
.rt small{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:12px;color:var(--text3);}
.has{font-size:10px;color:var(--text3);flex-shrink:0;font-family:var(--cinzel)}
.empty{font-family:var(--serif);font-style:italic;color:var(--text3);padding:1.5rem 0;text-align:center;}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:1rem;}
.ov.show{display:flex}
.box{background:var(--bg);border-radius:var(--rl);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:1.25rem;}
.box h3{font-family:var(--cinzel);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
.f{margin-bottom:10px}
.f label{display:block;font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.f2{display:flex;gap:8px}.f2>div{flex:1}
.checks{display:flex;gap:18px;margin:6px 0 12px;font-size:13px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.checks input{width:17px;height:17px;accent-color:#c9a84c}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--gold);color:#1a1714;font-size:11px;font-weight:700;padding:8px 20px;border-radius:99px;transition:transform .22s;pointer-events:none;z-index:999;font-family:var(--cinzel);letter-spacing:.08em;text-transform:uppercase;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.has{display:none}.time{width:44px}.badge{display:none}}

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function buildSeed(){
  const out=[];
  SEED.trim().split('\n').forEach(line=>{
    const m=line.trim().match(/^(\d{4}-\d{2}-\d{2})\s+([A-Z0-9]+)(?:@(\d{2}:\d{2})?)?\s*(.*)$/);
    if(!m)return;
    const [,date,code,atTime,rest]=m;
    const hasAt=line.includes('@');
    let type,title,time;
    switch(code){
      case 'W':type='weekly';title='Weekly graphic: '+rest;time='11:00';break;
      case 'N':type='weekly';title='Weekly nights graphic (no costume theme)';time='11:00';break;
      case 'M':type='monthly';title='Monthly announcement, 2 slides: '+rest;time='12:00';break;
      case 'C':type='cover';title='Facebook Event: '+rest;time='12:00';break;
      case 'K7':type='count';title='Countdown, 7 days: '+rest;time='12:00';break;
      case 'K3':type='count';title='Countdown, 3 days: '+rest;time='12:00';break;
      case 'K0':type='count';title='Countdown, day of: '+rest;time='12:00';break;
      case 'R':type='recap';title='Monthly recap: '+rest;time='12:00';break;
      case 'B':type='big';title='Big night: '+rest;time='';break;
      default:return;
    }
    if(hasAt)time=atTime||'';      // "@" alone = no fixed time ("by evening")
    out.push({id:`s_${date}_${code}_${slug(rest||'nights')}`,date,time,type,title,
      platform:TYPES[type].plat,caption:'',imageUrl:'',notes:'',created:false,posted:false});
  });
  return out;
}

/* ── STATE + STORAGE ── */
let db=null,fs=null,mode='local',posts=[];
let view='todo',typeF='all',monthF='all',editingId=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function banner(html,err){$('banner').innerHTML=html?`<div class="banner${err?' err':''}">${html}</div>`:'';}

async function init(){
  if(!FIREBASE_CONFIG.apiKey.startsWith('PASTE')){
    try{
      const app=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      fs=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      db=fs.getFirestore(app.initializeApp(FIREBASE_CONFIG));
      mode='cloud';
      fs.onSnapshot(fs.collection(db,COLLECTION),snap=>{
        posts=snap.docs.map(d=>({id:d.id,...d.data()}));
        render();
      },err=>banner('Could not read the <b>'+COLLECTION+'</b> collection: '+esc(err.message)+'. The Firestore rules need a rule for it.',true));
    }catch(e){
      mode='local';banner('Firebase failed to load ('+esc(e.message)+'). Running in this-browser-only mode.',true);
    }
  }
  if(mode==='local')posts=JSON.parse(localStorage.getItem(LS)||'[]');
  const m=$('mode');
  m.textContent=mode==='cloud'?'Synced · belladonna-hq':'This browser only';
  m.className='mode '+(mode==='cloud'?'cloud':'local');
  render();
}

async function persist(p){
  const i=posts.findIndex(x=>x.id===p.id);
  if(i>=0)posts[i]=p;else posts.push(p);
  if(mode==='cloud'){const{id,...rest}=p;await fs.setDoc(fs.doc(db,COLLECTION,id),rest);}
  else localStorage.setItem(LS,JSON.stringify(posts));
  render();
}
async function removePost(id){
  posts=posts.filter(p=>p.id!==id);
  if(mode==='cloud')await fs.deleteDoc(fs.doc(db,COLLECTION,id));
  else localStorage.setItem(LS,JSON.stringify(posts));
  render();
}
async function seedMissing(){
  const have=new Set(posts.map(p=>p.id));
  const add=buildSeed().filter(s=>!have.has(s.id));
  if(!add.length){toast('Nothing missing');return;}
  if(mode==='cloud'){
    for(let i=0;i<add.length;i+=400){
      const b=fs.writeBatch(db);
      add.slice(i,i+400).forEach(({id,...rest})=>b.set(fs.doc(db,COLLECTION,id),rest));
      await b.commit();
    }
  }else{
    posts=posts.concat(add);
    localStorage.setItem(LS,JSON.stringify(posts));
    render();
  }
  toast(add.length+' posts added');
}
window.seedMissing=seedMissing;

/* ── RENDER ── */
const isMile=p=>TYPES[p.type]?.milestone;
function overdue(p,t){return !isMile(p)&&!p.posted&&p.date<t;}

function render(){
  const t=todayStr();
  if(!posts.length){
    banner(`Your calendar is empty. <button class="btn btn-p" onclick="seedMissing()">Load my 2026–2027 calendars (${buildSeed().length} rows)</button>`);
  }else if($('banner').querySelector('.banner:not(.err)'))banner('');

  // month dropdown values
  const months=[...new Set(posts.map(p=>p.date.slice(0,7)))].sort();
  const bar=$('bar');
  const views=[['todo','To do'],['overdue','Overdue'],['all','Everything']];
  bar.innerHTML=views.map(([k,l])=>`<button class="chip ${view===k?'on':''}" data-v="${k}">${l}</button>`).join('')+
    `<select class="mini" id="tf"><option value="all">All templates</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${typeF===k?'selected':''}>${v.l}</option>`).join('')}</select>`+
    `<select class="mini" id="mf"><option value="all">All months</option>${months.map(m=>`<option value="${m}" ${monthF===m?'selected':''}>${monthName(m)}</option>`).join('')}</select>`;
  bar.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
  $('tf').onchange=e=>{typeF=e.target.value;render();};
  $('mf').onchange=e=>{monthF=e.target.value;render();};

  let list=posts.slice();
  if(typeF!=='all')list=list.filter(p=>p.type===typeF);
  if(monthF!=='all')list=list.filter(p=>p.date.startsWith(monthF));
  const end=addDays(t,14);
  if(view==='todo')list=list.filter(p=>(overdue(p,t))||(p.date>=t&&p.date<=end));
  if(view==='overdue')list=list.filter(p=>overdue(p,t));
  list.sort((a,b)=>(a.date+(a.time||'99'))<(b.date+(b.time||'99'))?-1:1);

  const real=list.filter(p=>!isMile(p));
  $('stats').innerHTML=
    `<div class="stat"><b>${real.length}</b><span>Showing</span></div>`+
    `<div class="stat"><b>${real.filter(p=>p.created).length}</b><span>Made</span></div>`+
    `<div class="stat"><b>${real.filter(p=>p.posted).length}</b><span>Posted</span></div>`+
    `<div class="stat ${posts.some(p=>overdue(p,t))?'bad':''}"><b>${posts.filter(p=>overdue(p,t)).length}</b><span>Overdue (all)</span></div>`;

  const L=$('list');
  if(!list.length){L.innerHTML='<div class="empty">Nothing here. '+(view==='todo'?'Try “Everything” to see the full calendar.':'')+'</div>';return;}
  let html='',curM='',curD='';
  list.forEach(p=>{
    const m=p.date.slice(0,7);
    if(view!=='todo'&&m!==curM){curM=m;html+=`<div class="monthh">${monthName(m)}</div>`;}
    if(p.date!==curD){
      if(curD)html+='</div>';
      curD=p.date;
      const tag=p.date===t?'<span class="tag today">Today</span>':(p.date<t&&list.some(x=>x.date===p.date&&overdue(x,t))?'<span class="tag od">Overdue</span>':'');
      html+=`<div class="day"><div class="dayh">${dayName(p.date)} ${tag}</div>`;
    }
    html+=rowHtml(p);
  });
  html+='</div>';
  L.innerHTML=html;
}
function monthName(m){return new Date(m+'-15T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function dayName(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
function fmtTime(t){if(!t)return '';const[h,m]=t.split(':').map(Number);return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h<12?'am':'pm'}`;}
function rowHtml(p){
  const T=TYPES[p.type]||TYPES.other,mile=isMile(p);
  const checks=mile?'<div class="ck" style="visibility:hidden"></div>':
    `<div class="ck"><input type="checkbox" data-k="created" ${p.created?'checked':''}/>Made</div><div class="ck"><input type="checkbox" data-k="posted" ${p.posted?'checked':''}/>Posted</div>`;
  const has=(p.caption?'✎ ':'')+(p.imageUrl?'🖼':'');
  return `<div class="row ${mile?'milestone':''} ${p.posted?'done':''}" data-id="${esc(p.id)}">${checks}<div class="time">${fmtTime(p.time)||'—'}</div><span class="badge" style="background:${T.bg};color:${T.c}">${T.l}</span><div class="rt">${esc(p.title)}${p.notes?`<small>${esc(p.notes)}</small>`:''}</div><div class="has">${has}</div></div>`;
}

$('list').addEventListener('click',e=>{
  const row=e.target.closest('.row');if(!row)return;
  const p=posts.find(x=>x.id===row.dataset.id);if(!p)return;
  const cb=e.target.closest('input[data-k]');
  if(cb){
    const k=cb.dataset.k,v=cb.checked,n={...p,[k]:v};
    if(k==='posted'&&v)n.created=true;
    if(k==='created'&&!v)n.posted=false;
    persist(n);
    return;
  }
  openEdit(p.id);
});

/* ── EDIT MODAL ── */
$('f-type').innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('');
function openEdit(id){
  editingId=id||null;
  const p=id?posts.find(x=>x.id===id):{date:todayStr(),time:'12:00',type:'weekly',title:'',platform:'IG + FB',caption:'',imageUrl:'',notes:'',created:false,posted:false};
  $('mt').textContent=id?'Edit post':'Add post';
  $('f-date').value=p.date;$('f-time').value=p.time||'';$('f-type').value=p.type;$('f-plat').value=p.platform||'';
  $('f-title').value=p.title;$('f-cap').value=p.caption||'';$('f-img').value=p.imageUrl||'';$('f-notes').value=p.notes||'';
  $('f-created').checked=!!p.created;$('f-posted').checked=!!p.posted;
  $('f-del').style.display=id?'':'none';
  $('ov').classList.add('show');
}
function closeEdit(){$('ov').classList.remove('show');}
async function saveEdit(){
  const title=$('f-title').value.trim(),date=$('f-date').value;
  if(!title||!date){toast('Needs a date and a title');return;}
  const old=editingId?posts.find(x=>x.id===editingId):null;
  let created=$('f-created').checked,posted=$('f-posted').checked;
  if(posted)created=true;
  await persist({...(old||{}),id:editingId||('p_'+Date.now()),date,time:$('f-time').value,type:$('f-type').value,
    platform:$('f-plat').value.trim(),title,caption:$('f-cap').value,imageUrl:$('f-img').value.trim(),notes:$('f-notes').value.trim(),created,posted});
  closeEdit();toast('Saved');
}
async function delPost(){if(editingId&&confirm('Delete this post?')){await removePost(editingId);closeEdit();}}
window.openEdit=openEdit;window.closeEdit=closeEdit;window.saveEdit=saveEdit;window.delPost=delPost;

/* ── BUFFER CSV EXPORT ── (Buffer’s bulk upload: Text, Image URL, Tags, Posting Time) */
function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"';}
function exportBuffer(){
  const t=todayStr();
  let list=posts.filter(p=>!isMile(p)&&!p.posted&&p.date>=t);
  if(typeF!=='all')list=list.filter(p=>p.type===typeF);
  if(monthF!=='all')list=list.filter(p=>p.date.startsWith(monthF));
  const ready=list.filter(p=>p.caption.trim());
  const skipped=list.length-ready.length;
  if(!ready.length){toast('No upcoming posts have a caption yet');return;}
  ready.sort((a,b)=>(a.date+(a.time||'12:00'))<(b.date+(b.time||'12:00'))?-1:1);
  const rows=[['Text','Image URL','Tags','Posting Time'].map(csvCell).join(',')];
  ready.forEach(p=>rows.push([p.caption,p.imageUrl,'',`${p.date} ${p.time||'12:00'}`].map(csvCell).join(',')));
  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='buffer-bulk-'+t+'.csv';document.body.appendChild(a);a.click();a.remove();
  toast(ready.length+' posts exported'+(skipped?` · ${skipped} skipped (no caption)`:''));
}
window.exportBuffer=exportBuffer;

init();
</script>
</body>
