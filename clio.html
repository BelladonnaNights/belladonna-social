<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Belladonna Clio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem("bn_clio_theme");if(_t)document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* HQ is the canonical style: black + gold. Light mode uses the Planner's cream palette. */
:root{
  --bg:#000000;--surface:#0d0d0d;--surface2:#141414;--surface3:#1a1a1a;--surface4:#212121;
  --border:rgba(180,150,100,0.16);--border2:rgba(180,150,100,0.34);--border-gold:rgba(201,169,110,0.4);
  --gold:#c9a96e;--gold2:#e0bc7e;--gold-dim:rgba(201,169,110,0.12);
  --gold-shine:linear-gradient(135deg,#c9a84c 0%,#f5df90 45%,#c9a84c 70%,#e2b84a 100%);
  --live:#3a9a5a;--live-dim:rgba(58,154,90,0.14);--rose:#b0505a;--rose-dim:rgba(176,80,90,0.16);
  --text:#f0ece0;--text2:#b8ad98;--text3:#8a8272;--text4:#4a4638;
  --btn-text:#000;--nav-bg:#000;
  --radius:8px;--rl:12px;
  --display:'Bebas Neue',sans-serif;--cinzel:'Cinzel',serif;--serif:'EB Garamond',serif;--font:'DM Sans',sans-serif;
}
:root[data-theme="light"]{
  --bg:#faf6ec;--surface:#ffffff;--surface2:#f6efe0;--surface3:#ede2c8;--surface4:#e4d7b6;
  --border:rgba(40,30,10,.10);--border2:rgba(40,30,10,.18);--border-gold:rgba(169,127,34,.5);
  --gold:#a97f22;--gold2:#8c6a1e;--gold-dim:rgba(169,127,34,.12);
  --gold-shine:linear-gradient(135deg,#a97f22 0%,#c99a30 45%,#a97f22 70%,#93711c 100%);
  --live:#2f7a47;--live-dim:rgba(47,122,71,.14);--rose:#a43a45;--rose-dim:rgba(164,58,69,.12);
  --text:#2a2118;--text2:#5c4f3e;--text3:#8a7a63;--text4:#b8a98c;
  --btn-text:#fff;--nav-bg:#faf6ec;
}
html,body{min-height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:300;letter-spacing:.04em;overflow-x:hidden;}
input[type=checkbox]{accent-color:var(--gold);}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.nav{background:var(--nav-bg);padding:0 1.25rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;height:62px;}
.gold-line{height:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);position:sticky;top:62px;z-index:49;}
.logo-group{display:flex;flex-direction:column;line-height:1;flex-shrink:0;}
.logo{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;color:var(--text);text-transform:uppercase;}
.logo-sub{font-family:var(--cinzel);font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:3px;}
.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:21px .7rem;font-family:var(--cinzel);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--text3);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;white-space:nowrap;transition:all .2s;}
.tab:hover{color:var(--text2)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);}
.burger{display:none;font-size:18px;line-height:1;padding:6px 12px}
.nav.compact .tabs{display:none}.nav.compact .burger{display:inline-block}.nav.compact #th,.nav.compact #so{display:none!important}.nav.compact .logo-group{margin-right:auto}
#navmenu{display:none;position:fixed;top:68px;right:12px;left:auto;width:min(260px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border-gold);border-radius:var(--rl);z-index:60;padding:6px 16px 10px;box-shadow:0 12px 24px rgba(0,0,0,.35);max-height:calc(100vh - 70px);overflow-y:auto}
body.menu-open #navmenu{display:block}
#navmenu .tab{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--border)}
#navmenu .tab.on{border-bottom-color:var(--gold)}
.curtab{font-family:var(--cinzel);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;white-space:nowrap;flex-shrink:0}
.mode{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--border2);color:var(--text3);white-space:nowrap;flex-shrink:0;}
.mode.cloud{color:var(--live);border-color:var(--live);}
.mode.local{color:var(--gold);border-color:var(--border-gold);}
.btn{cursor:pointer;font-family:var(--cinzel);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border-radius:var(--radius);padding:.55rem 1rem;border:none;white-space:nowrap;transition:all .2s;}
.btn-p{background:var(--gold-shine);color:var(--btn-text);}
.btn-p:hover{filter:brightness(1.08)}
.btn-g,.btn-gold{background:transparent;border:1px solid var(--border-gold);color:var(--gold);}
.btn-g:hover,.btn-gold:hover{background:var(--gold-dim)}
.btn-d{background:none;border:1px solid var(--rose);color:var(--rose);}
.wrap{max-width:980px;margin:0 auto;padding:1.25rem 1rem 4rem;}
.title{font-family:var(--display);font-size:2rem;letter-spacing:.05em;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.sub{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text3);margin:2px 0 16px;letter-spacing:.01em;}
.banner{background:var(--gold-dim);border:1px solid var(--border-gold);border-radius:var(--rl);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.banner.err{background:var(--rose-dim);border-color:var(--rose);}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:8px 14px;min-width:96px;}
.stat b{display:block;font-family:var(--cinzel);font-size:18px;font-weight:600;color:var(--text);}
.stat span{font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
.stat.bad b{color:var(--rose)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.chip{padding:5px 13px;border-radius:999px;font-size:.65rem;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text3);font-family:var(--font);letter-spacing:.15em;text-transform:uppercase;font-weight:400;transition:all .2s;}
.chip:hover{border-color:var(--border2);color:var(--text2)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}
select,input[type=text],input[type=date],input[type=time],input[type=password],textarea{font-family:var(--font);font-size:13px;font-weight:400;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface3);color:var(--text);width:100%;}
select.mini{width:auto;font-size:12px;padding:5px 10px;border-radius:999px;color:var(--gold);}
textarea{resize:vertical;min-height:90px;line-height:1.5;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);}
.sec{font-size:.65rem;letter-spacing:.32em;text-transform:uppercase;color:var(--text3);font-weight:400;margin:20px 0 8px;}
.day{margin-bottom:14px;}
.dayh{font-family:var(--cinzel);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:4px 2px;border-bottom:1px solid var(--border);margin-bottom:6px;display:flex;gap:8px;align-items:center;}
.dayh .tag{font-size:8px;padding:1px 8px;border-radius:999px;letter-spacing:.08em;}
.dayh .today{background:var(--gold);color:var(--btn-text)}
.dayh .od{background:var(--rose-dim);color:var(--rose)}
.monthh{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;color:var(--gold);margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border2);}
.grp{margin:4px 0 8px;border:1px solid var(--border-gold);border-radius:var(--rl);background:var(--surface2)}
.grph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border)}
.grph b{font-weight:600;color:var(--gold2)}
.grpb{border-left:3px solid var(--gold);margin:6px 8px 8px 14px;padding-left:8px}
.grpb .row{margin-bottom:3px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--rl);margin-bottom:4px;cursor:pointer;transition:border-color .2s;}
.row:hover{border-color:var(--border-gold)}
.row.done{opacity:.6;border-left-color:var(--live)}
.row.od{border-left-color:var(--rose)}
.row.milestone{background:var(--gold-dim);border-color:var(--border-gold);}
.ck{display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--cinzel);font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);width:42px;flex-shrink:0;}
.ck input{width:17px;height:17px;cursor:pointer;}
.time{font-family:var(--cinzel);font-size:10px;color:var(--text3);width:52px;flex-shrink:0;}
.badge{font-size:9px;font-weight:600;padding:2px 9px;border-radius:999px;font-family:var(--cinzel);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;border:1px solid var(--border-gold);color:var(--gold2);}
.badge.hi{background:var(--gold-dim);}
.rt{flex:1;min-width:0;font-size:13px;font-weight:400;}
.rt small{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:13px;color:var(--text3);}
.has{font-size:10px;color:var(--text3);flex-shrink:0;font-family:var(--cinzel)}
.empty{font-family:var(--serif);font-style:italic;color:var(--text3);padding:1.5rem 0;text-align:center;font-size:15px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;}
.card h4{font-family:var(--cinzel);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;color:var(--gold);}
.card .meta{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text2);margin-bottom:8px;letter-spacing:.01em;}
.card .lbl{display:block;font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:8px 0 3px;}
.prog{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden;margin:6px 0;}
.prog i{display:block;height:100%;background:var(--gold-shine);}
.prog.posted i{background:var(--live);}
.nick{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;}
/* month grid */
.mnav{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mnav .mt{font-family:var(--display);font-size:1.6rem;letter-spacing:.06em;color:var(--gold);flex:1;text-align:center;}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.mh{font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);text-align:center;padding:4px 0;}
.mc{min-height:84px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px 5px;cursor:pointer;overflow:hidden;}
.mc:hover{border-color:var(--border-gold)}
.mc.out{opacity:.25;cursor:default;background:none;border-style:dashed}
.mc.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.md{font-size:11px;color:var(--text2);font-weight:400;}
.mc.today .md{color:var(--btn-text);background:var(--gold);display:inline-block;min-width:18px;text-align:center;border-radius:99px;font-weight:600;}
.mp{display:block;font-size:9px;font-family:var(--cinzel);letter-spacing:.04em;padding:1px 5px;margin-top:2px;border-radius:4px;background:var(--gold-dim);color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mp.done{background:var(--live-dim);color:var(--live)}
.mp.sched{background:transparent;border:1px solid var(--gold);color:var(--gold2)}
.row.sched{border-left-color:var(--gold)}
.dp{display:block;font-size:10px;font-family:var(--cinzel);letter-spacing:.04em;padding:2px 6px;margin-top:3px;border-radius:4px;background:var(--gold-dim);color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.dp.done{background:var(--live-dim);color:var(--live)}.dp.od{background:var(--rose-dim);color:var(--rose)}.dp.sched{background:transparent;border:1px solid var(--gold)}
.mp.od{background:var(--rose-dim);color:var(--rose)}
.mp.big{background:var(--gold);color:var(--btn-text);font-weight:600}
.mp.more{background:none;color:var(--text3)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:1rem;}
.ov.show{display:flex}
.box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);width:100%;max-width:580px;max-height:92vh;overflow-y:auto;padding:1.25rem;}
.box h3{font-family:var(--cinzel);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;color:var(--gold);}
.f{margin-bottom:10px}
.f label{display:block;font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.f2{display:flex;gap:8px}.f2>div{flex:1}
.checks{display:flex;gap:18px;margin:6px 0 12px;font-size:13px;color:var(--text2)}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.checks input{width:17px;height:17px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.sp{flex:1}
.tools{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--gold);color:var(--btn-text);font-size:11px;font-weight:700;padding:8px 20px;border-radius:999px;transition:transform .22s;pointer-events:none;z-index:999;font-family:var(--cinzel);letter-spacing:.08em;text-transform:uppercase;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0)}
.dropz{outline:2px dashed var(--gold);outline-offset:4px;border-radius:6px}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;max-width:520px}
.gt{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,var(--surface3),var(--surface));border:1px solid var(--border);overflow:hidden;cursor:pointer}
.gt:hover{border-color:var(--border-gold)}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gtl{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:11px;color:var(--text2);line-height:1.3}
.gt img~.gtl{display:none}
.gtd{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-family:var(--cinzel);font-size:9px;letter-spacing:.06em;background:rgba(0,0,0,.65);color:var(--gold2);text-align:center}
@media(max-width:600px){.has{display:none}.time{width:44px}.badge{display:none}.mode{display:none}.logo{font-size:1.2rem}
  .mc{min-height:58px;padding:3px}.mp{font-size:0;padding:0;width:6px;height:6px;border-radius:50%;display:inline-block;margin:2px 1px 0 0}.mp.more{width:auto;font-size:8px;height:auto}}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo-group"><div class="logo">Belladonna</div><div class="logo-sub">Clio</div></div>
  <div class="tabs" id="tabs"></div>
  <span class="curtab" id="curtab"></span>
  <span class="mode" id="mode">…</span>
  <button class="btn btn-g" id="th" data-act="theme">☀ Light</button>
  <button class="btn btn-g" id="so" data-act="signout" style="display:none">Sign out</button>
  <button class="btn btn-p" data-act="new">+ Post</button>
  <button class="btn btn-g burger" id="burger" data-act="burger" aria-label="Menu">☰</button>
</nav>
<div id="navmenu"></div>
<div class="gold-line"></div>
<div class="wrap"><div id="banner"></div><div id="view"></div></div>

<div class="ov" id="ov" onclick="if(event.target===this)closeEdit()">
  <div class="box">
    <h3 id="mt">Post</h3>
    <div class="f"><label>What it is</label><input type="text" id="f-title"/></div>
    <div class="f2">
      <div class="f"><label>Date</label><input type="date" id="f-date"/></div>
      <div class="f"><label>Time</label><input type="time" id="f-time"/></div>
    </div>
    <div class="f2">
      <div class="f"><label>Template</label><select id="f-type"></select></div>
      <div class="f"><label>Where</label><input type="text" id="f-plat" placeholder="IG + FB"/></div>
    </div>
    <div id="f-sum" class="card" style="padding:10px 12px;margin-bottom:10px"></div>
    <div class="f"><label>Text from your Content Bank (The Muse puts it on the template)</label><select id="f-bank"></select></div>
    <div class="checks">
      <label><input type="checkbox" id="f-created"/> Made</label>
      <label><input type="checkbox" id="f-sched"/> Scheduled</label>
      <label><input type="checkbox" id="f-posted"/> Posted</label>
    </div>
    <div class="tools"><button class="btn btn-gold" type="button" onclick="promoPrompt()">✦ Copy caption prompt (for Muse)</button></div>
    <div class="f" id="f-muse-wrap" style="display:none"><label>Prompt (copied to clipboard, edit the [brackets])</label><textarea id="f-muse" style="min-height:200px"></textarea></div>
    <details id="f-more" style="margin:12px 0"><summary style="cursor:pointer;color:var(--gold2)">More: caption, hashtags, image, notes, graphic tools</summary>
    <div class="f"><label>Carousel post name (posts with the same name on the same day are grouped as slides of one post)</label><input type="text" id="f-grp" list="grp-list" placeholder="Leave empty for a single post, e.g. Songs that trigger the bar"/><datalist id="grp-list"></datalist></div>
    <div class="f"><label>Caption (goes to Buffer)</label><textarea id="f-cap"></textarea>
      <div class="tools" style="margin:6px 0 0"><button class="btn btn-g" type="button" id="b-cap" onclick="capPrompt()">Copy caption prompt (paste into ChatGPT)</button></div></div>
    <div class="f"><label>Hashtags (Instagram only, kept separate from the caption)</label><textarea id="f-hash" style="min-height:60px" placeholder="#belladonnanights #karaoke"></textarea>
      <div id="f-tags" class="bar" style="margin:6px 0 0"></div></div>
    <div class="f"><label>Image (upload, or paste a direct .jpg / .png link)</label><input type="text" id="f-img" placeholder="https://…" oninput="imgPrev()"/>
      <div class="tools" style="margin:6px 0 0"><button class="btn btn-g" type="button" id="b-up" onclick="document.getElementById('f-file').click()">Upload image</button><input type="file" id="f-file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadImg(this)"/></div>
      <img id="f-prev" alt="" style="display:none;max-width:140px;max-height:140px;margin-top:8px;border:1px solid var(--border2);border-radius:var(--radius)"/></div>
    <div class="f" id="f-win" style="display:none"></div>
    <div class="f"><label>Notes</label><input type="text" id="f-notes"/></div>
    <div class="tools">
      <button class="btn btn-gold" onclick="muse()">✦ The Muse: build ChatGPT prompt</button>
      <button class="btn btn-gold" onclick="openGfx()">▣ Make graphic</button>
      <button class="btn btn-gold" id="f-slide" onclick="addSlide()">▤ Add another slide</button>
      <button class="btn btn-gold" id="f-enc" onclick="encore()">↻ Encore: duplicate</button>
    </div>
    </details>
    <div class="acts">
      <button class="btn btn-d" id="f-del" onclick="delPost()">Delete</button>
      <div class="sp"></div>
      <button class="btn btn-g" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-p" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">

const LIB_FIELDS=['name','nick','size','use','group','freq','canvas','badge'];
function libList(withDeleted){
  const out=[];
  LIB_SEED.forEach(t=>{
    const o=libOv[t.id]||{},m=LIB_META[t.id]||{};
    const e={...t,...m,custom:false};
    LIB_FIELDS.forEach(f=>{if(o[f]!==undefined&&o[f]!==null)e[f]=o[f];});
    if(o.group==='Monthly & weekly')e.group=m.group||e.group;
    e.silenced=!!o.silenced;e.deleted=(o.deleted===undefined&&t.id==='pin')?true:!!o.deleted;out.push(e);
  });
  Object.entries(libOv).forEach(([id,o])=>{
    if(o&&o.custom){const e={id,custom:true,name:o.name||'Untitled',nick:o.nick||'',size:o.size||'',use:o.use||'',group:o.group||'Other',freq:o.freq||'',canvas:o.canvas||'',badge:o.badge||'',silenced:!!o.silenced,deleted:!!o.deleted};out.push(e);}
  });
  return withDeleted?out:out.filter(e=>!e.deleted);
}
const NOT_TPL=['rook','crowd','note'];
function isTpl(x){return x.id.startsWith('cv_')||(!x.custom&&!NOT_TPL.includes(x.id));}
function tplList(){return libList().filter(isTpl);}
let typeSig='';
function syncTypes(){
  libList(true).forEach(e=>{
    if(e.deleted)return;
    const label=e.nick||e.name;
    if(TYPES[e.id])TYPES[e.id].l=label;
    else if(e.custom&&!e.id.startsWith('cv_'))TYPES[e.id]={l:label,c:'#444441',bg:'#f4f3f0',plat:'IG + FB'};
  });
  const sig=Object.entries(TYPES).map(([k,v])=>k+':'+v.l).join('|');
  if(sig!==typeSig){typeSig=sig;if(typeof buildTypeOptions==='function')buildTypeOptions();}
}

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function buildSeed(){
  const out=[];
  SEED.trim().split('\n').forEach(line=>{
    const m=line.trim().match(/^(\d{4}-\d{2}-\d{2})\s+([A-Z0-9]+)(?:@(\d{2}:\d{2})?)?\s*(.*)$/);
    if(!m)return;
    const [,date,code,atTime,rest]=m;
    const hasAt=line.includes('@');
    let type,title,time;
    switch(code){
      case 'W':type='weekly';title='Weekly graphic: '+rest;time='11:00';break;
      case 'N':type='weekly';title='Weekly nights graphic (no costume theme)';time='11:00';break;
      case 'M':type='monthly';title='Monthly announcement, 3 slides: '+rest;time='12:00';break;
      case 'C':type='cover';title='Facebook Event: '+rest;time='12:00';break;
      case 'K7':type='count';title='Countdown, 7 days: '+rest;time='12:00';break;
      case 'K3':type='count';title='Countdown, 3 days: '+rest;time='12:00';break;
      case 'K0':type='count';title='Countdown, day of: '+rest;time='12:00';break;
      case 'R':type='recap';title='Monthly recap: '+rest;time='12:00';break;
      case 'B':type='big';title='Big night: '+rest;time='';break;
      default:return;
    }
    if(hasAt)time=atTime||'';
    out.push({id:`s_${date}_${code}_${slug(rest||'nights')}`,date,time,type,title,
      platform:TYPES[type].plat,caption:'',imageUrl:'',notes:'',created:false,posted:false});
  });
  return out;
}

async function init(){
  if(!FIREBASE_CONFIG.apiKey.startsWith('PASTE')){
    try{
      const fa=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      fs=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      authMod=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
      const appInst=fa.initializeApp(FIREBASE_CONFIG);
      db=fs.getFirestore(appInst);auth=authMod.getAuth(appInst);
      try{rtMod=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');rtdb=rtMod.getDatabase(appInst);}catch(e){console.warn('Realtime DB failed to load:',e.message);}
      mode='cloud';
      authMod.onAuthStateChanged(auth,u=>{
        authChecked=true;user=u;unsubs.forEach(f=>f());unsubs=[];
        if(u){
          const bad=err=>banner('Firestore says: '+esc(err.message)+'. Clio needs an account with role admin to read and save.',true);
          unsubs.push(fs.onSnapshot(fs.collection(db,COL_POSTS),snap=>{posts=snap.docs.map(d=>({id:d.id,...d.data()}));postsLoaded=true;render();bigSoon();},bad));
          unsubs.push(fs.onSnapshot(fs.collection(db,COL_LIB),snap=>{libOv={};snap.docs.forEach(d=>libOv[d.id]=d.data());render();},bad));
          unsubs.push(fs.onSnapshot(fs.collection(db,'gig_schedule'),snap=>{hqGigs=snap.docs.map(d=>({id:d.id,...d.data()}));rebuildGigs();gigsLoaded=true;render();bigSoon();},err=>console.warn('gig_schedule:',err.message)));
          if(rtdb){[['tv','trivia/planner/venues'],['tg','trivia/planner/gigs'],['kv','trivia/planner/karaokeVenues'],['kg','trivia/planner/karaokeGigs'],['ev','trivia/planner/eventVenues'],['eg','trivia/planner/eventGigs'],['bv','bingo/landing/venues'],['bs','bingo/landing/schedule'],['mv','venues']].forEach(([k,path])=>{try{unsubs.push(rtMod.onValue(rtMod.ref(rtdb,path),sn=>{rt[k]=sn.val()||{};rtSoon();},err=>console.warn(path+': '+err.message)));}catch(e){console.warn(path,e.message);}});}
          setTimeout(()=>syncBuffer(false),5000);setTimeout(()=>{if(mode==='cloud'&&posts.length)migrateTitles();},3500);setTimeout(()=>{if(mode==='cloud'&&posts.length)runGen(false);},4500);
        }else{posts=[];libOv={};gigs=[];hqGigs=[];rt={};gigsLoaded=false;postsLoaded=false;}
        render();
      });
    }catch(e){mode='local';banner('Firebase failed to load ('+esc(e.message)+'). Running in this-browser-only mode.',true);}
  }
  if(mode==='local'){
    posts=JSON.parse(localStorage.getItem(LS)||'[]');
    libOv=JSON.parse(localStorage.getItem(LS_LIB)||'{}');
  }
  const m=$('mode');
  m.textContent=mode==='cloud'?'Synced':'This browser only';
  m.className='mode '+(mode==='cloud'?'cloud':'local');
  render();
}
async function persist(p){
  const i=posts.findIndex(x=>x.id===p.id),wasSched=i>=0?!!posts[i].scheduled:false;
  if(i>=0)posts[i]=p;else posts.push(p);
  if(!!p.scheduled!==wasSched)invAdjust(p,p.scheduled?-1:1);
  try{
    if(mode==='cloud'){const{id,...rest}=clean(p);await fs.setDoc(fs.doc(db,COL_POSTS,id),rest);}
    else localStorage.setItem(LS,JSON.stringify(posts));
  }catch(e){saveFail(e);}
  render();
}
async function removePost(id){
  const gone=posts.find(p=>p.id===id);
  if(gone&&gone.genKey)await saveLib('gen',{skip:[...((libOv.gen||{}).skip||[]),gone.genKey]});
  posts=posts.filter(p=>p.id!==id);
  if(mode==='cloud')await fs.deleteDoc(fs.doc(db,COL_POSTS,id));
  else localStorage.setItem(LS,JSON.stringify(posts));
  render();
}
const clean=o=>JSON.parse(JSON.stringify(o));
function saveFail(e){
  const m=(e&&e.message)||String(e);
  banner('This did NOT save to Firebase: '+esc(m)+(/permission|insufficient/i.test(m)?'. Firebase refused it: the latest firestore.rules must be published, and this account needs Clio access (role admin, or adminAccess.clio ticked in HQ).':'. Check your connection and try again.'),true);
  toast('Not saved. See the red message at the top');
}
async function saveLib(id,patch,quiet){
  libOv[id]=clean({...(libOv[id]||{}),...patch});
  try{
    if(mode==='cloud')await fs.setDoc(fs.doc(db,COL_LIB,id),libOv[id]);
    else localStorage.setItem(LS_LIB,JSON.stringify(libOv));
    if(!quiet)toast(mode==='cloud'?'Saved to Firebase':'Saved on this browser only');

const RT_DAYS={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
const rtNorm=n=>String(n||'').toLowerCase().trim();
const rtKey=n=>String(n||'').toLowerCase().replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
function rtKind(k){const x=String(k||'').toLowerCase();return x==='trivia'?'Trivia':x==='karaoke'?'Karaoke':x==='bingo'?'Bingo':(x==='events'||x==='private events')?'Events':'';}
function rtRuns(v,dk){
  if(!v)return false;
  if(v.endsOn&&dk>=v.endsOn)return false;
  const cad=v.cadence||'weekly',st=v.status||'active',d=new Date(dk+'T12:00:00');
  if(cad==='single')return !!v.cadenceAnchor&&v.cadenceAnchor===dk&&(st==='active'||st==='seasonal'||st==='one-time');
  if(!(st==='active'||st==='seasonal'))return false;
  if(RT_DAYS[String(v.day||'').slice(0,3).toLowerCase()]!==d.getDay())return false;
  const a=v.cadenceAnchor?new Date(v.cadenceAnchor+'T12:00:00'):null;
  if(cad==='biweekly'&&a){const diff=Math.round((d-a)/86400000);return Math.abs(Math.floor(diff/7))%2===0;}
  if(cad==='monthly'&&a)return Math.ceil(d.getDate()/7)===Math.ceil(a.getDate()/7);
  return true;
}
function rtMasterTime(kind,name,dow){
  const m=Object.values(rt.mv||{}).find(x=>x&&x.name&&rtKey(x.name)===rtKey(name));if(!m||!m.slots)return '';
  const day=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dow];
  const sl=Object.values(m.slots).find(x=>x&&x.time&&x.day===day&&(rtKind(x.kind)||x.kind)===kind&&(!x.status||x.status==='active'||x.status==='seasonal'||x.status==='one-time'));
  return sl?sl.time:'';
}
function externalGigs(from,to){
  const out=[],seen=new Set(),hqBy={};
  hqGigs.forEach(g=>{if(g.date)(hqBy[g.date]=hqBy[g.date]||new Set()).add(rtNorm(g.venue)+'|'+(rtKind(g.kind)||g.kind));});
  const add=(g)=>{const k=g.date+'|'+rtNorm(g.venue)+'|'+g.kind;if(seen.has(k))return;seen.add(k);out.push(g);};
  const sets=[['Trivia',rt.tv,rt.tg],['Karaoke',rt.kv,rt.kg],['Events',rt.ev,rt.eg]];
  for(let ds=from;ds<=to;ds=addDays(ds,1)){
    const dow=new Date(ds+'T12:00:00').getDay(),hq=hqBy[ds]||new Set();
    sets.forEach(([kk,pv,pg])=>{
      Object.entries(pv||{}).forEach(([id,v])=>{
        if(!v||!v.name||hq.has(rtNorm(v.name)+'|'+kk))return;
        const ov=pg&&pg[id]?pg[id][ds]:null;
        if(ov&&ov.deletedByHQ)return;
        if(!ov&&!rtRuns(v,ds))return;
        const kind=kk==='Events'?((ov&&ov.eventKind)||v.eventKind||'Events'):kk;
        add({id:'ext_'+kk+'_'+id+'_'+ds,date:ds,time:(ov&&ov.time)||rtMasterTime(kk,v.name,dow)||v.time||'',venue:v.name,kind,host:(ov&&ov.host)||v.host||'Unassigned',status:(ov&&ov.status==='cancelled')?'cancelled':'scheduled',ext:true});
      });
    });
    Object.values(rt.bs||{}).filter(e=>e&&e.date===ds).forEach(e=>{
      const bv=(rt.bv||{})[e.venueId]||{},name=bv.name;if(!name||hq.has(rtNorm(name)+'|Bingo'))return;
      add({id:'ext_Bingo_'+(e.id||e.venueId)+'_'+ds,date:ds,time:e.time||rtMasterTime('Bingo',name,dow)||bv.time||'',venue:name,kind:'Bingo',host:e.host||bv.host||'Unassigned',status:'scheduled',ext:true});
    });
  }
  return out;
}

function t24(t){
  if(t==null||t==='')return '';
  const m=/^\s*(\d{1,2})(?::(\d{2}))?\s*([ap])?\.?m?\.?/i.exec(String(t));if(!m)return '';
  let h=+m[1];const ap=(m[3]||'').toLowerCase();
  if(ap==='p'&&h<12)h+=12;if(ap==='a'&&h===12)h=0;
  if(!ap&&m[1].length===1&&h>=1&&h<=11)h+=12;
  if(h>23)return '';
  return pad(h)+':'+(m[2]||'00');
}
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const isPublicGig=g=>g.date&&g.status!=='cancelled'&&!/event/i.test(g.kind||'');
function virtualRows(){

  gigs.forEach(g=>{

    const v=g.venue||'venue',k=g.kind||'night',t=t24(g.time);
    const mk=(code,date,time,type,title)=>{
      const id='g_'+g.id+'_'+code;if(have.has(id))return;
      if((libOv[type]||{}).silenced||(libOv[type]||{}).deleted)return;
      out.push({id,date,time,type,title,platform:TYPES[type].plat,caption:'',imageUrl:'',notes:(g.host&&g.host!=='Unassigned')?'Host: '+g.host:'',created:false,posted:false,auto:true});
    };

}
function nightLines(from,to,perDate){

let gigsLoaded=false,postsLoaded=false,bigTimer=null;
function bigSoon(){clearTimeout(bigTimer);bigTimer=setTimeout(()=>{syncBigNights().catch(e=>console.warn('big nights sync:',e));},1200);}
async function rawDel(id){posts=posts.filter(p=>p.id!==id);if(mode==='cloud')await fs.deleteDoc(fs.doc(db,COL_POSTS,id));}
async function syncBigNights(){
  if(mode!=='cloud'||!user||!gigsLoaded||!postsLoaded)return;
  const t=todayStr(),evOf=p=>p.title.replace(/^Big night:\s*/i,'');
  const depsOf=ev=>posts.filter(p=>p.gen&&!p.posted&&['cover','count'].includes(p.type)&&p.title.endsWith(': '+ev));
  const want=new Map();
  gigs.filter(g=>g.bigNight&&g.date&&g.status!=='cancelled').forEach(g=>want.set('hqbig_'+g.id,g));
  let changed=false;
  for(const p of posts.filter(x=>x.type==='big'&&x.hqGig)){
    const g=want.get(p.id);
    if(!g){if(p.posted)continue;for(const d of depsOf(evOf(p)))await rawDel(d.id);await rawDel(p.id);changed=true;continue;}
    const title='Big night: '+(g.bigName||((g.kind||'Event')+' at '+g.venue)),time=t24(g.time)||'';
    if(p.title!==title||p.date!==g.date||(p.time||'')!==time){
      for(const d of depsOf(evOf(p)))await rawDel(d.id);
      quietSave({...p,title,date:g.date,time});changed=true;
    }
  }
  for(const [id,g] of want){
    if(posts.some(p=>p.id===id)||g.date<t)continue;
    quietSave({id,date:g.date,time:t24(g.time)||'',type:'big',title:'Big night: '+(g.bigName||((g.kind||'Event')+' at '+g.venue)),platform:TYPES.big.plat,caption:'',imageUrl:'',notes:g.notes||'',created:false,posted:false,hqGig:g.gigId||id.slice(6)});changed=true;
  }
  if(changed){render();setTimeout(()=>{if(mode==='cloud'&&posts.length)runGen(false);},800);}

function cadOcc(from,to){
  const out={},add=(e,ds)=>{if(ds>=from&&ds<=to)(out[ds]=out[ds]||[]).push(e);};
  const bigs=posts.filter(p=>p.type==='big');
  cadAll().forEach(e=>{
    if(e.silenced)return;
    const r=ruleOf(e.id);if(!r||!r.kind||r.kind==='none'||r.kind==='hq')return;
    if(r.kind==='monthly_day'||r.kind==='month_end'){
      let d=new Date(from.slice(0,7)+'-01T12:00:00');
      while(ymd(d).slice(0,7)<=to.slice(0,7)){const y=d.getFullYear(),m=d.getMonth()+1,ld=lastDay(y,m);add(e,y+'-'+pad(m)+'-'+pad(r.kind==='month_end'?ld:Math.min(+r.day||1,ld)));d.setMonth(d.getMonth()+1);}
    }else if(r.kind==='weekday'||r.kind==='nth_week'){
      for(let ds=from;ds<=to;ds=addDays(ds,1)){if(new Date(ds+'T12:00:00').getDay()===+r.weekday&&(r.kind==='weekday'||(r.weeks||[]).includes(weekOfMonth(ds))))add(e,ds);}
    }else if(r.kind==='before_event'){
      bigs.forEach(b=>(r.offsets||[]).forEach(off=>add(e,addDays(b.date,-off))));
    }
  });
  return out;
}

const STYLE='Style: dark gothic botanical, near-black background, antique gold and cream accents, deadly nightshade sprigs framing the corners, a raven perched at the top. Elegant serif display font for the title, clean sans-serif for details. No emojis, no clip art, no cheesy party elements.';
function museFor(type,title,date){
  const wk=(type==='weekly'&&gigs.length&&date)?nightLines(date,addDays(date,6),true):[];
  const mo=(type==='monthly'&&gigs.length&&date)?(()=>{const d=new Date(date+'T12:00:00');return nightLines(ymd(new Date(d.getFullYear(),d.getMonth()+1,1)),ymd(new Date(d.getFullYear(),d.getMonth()+2,0)),false);})():[];
  const t=title.includes(': ')?title.split(': ').slice(1).join(': '):title;
  const ev=t.replace(/^\d+ days?: /,'');
  if(type==='monthly')return `Create a 1080x1350 Instagram graphic for a live entertainment brand called Belladonna. ${STYLE}\n\nLayout, top to bottom:\n1. Small gold line: "BELLADONNA PRESENTS"\n2. Huge title: "[MONTH NAME]"\n3. Subtitle: "${t}"\n4. Four lines, one per week, each with the date and costume theme: "[Mon DATE] [WEEK 1 THEME]", and so on for weeks 2 to 4\n5. A gold highlighted line: "BIG NIGHT: [EVENT NAME], [DAY, DATE]"\n6. Bottom line: "Dress in the theme. Or any costume. Bonus card for everyone who does."\n7. Small footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD]. Keep the text large and perfectly spelled.${mo.length?'\n\nThen make slide 2, "Monthly Schedule", listing every venue and night, one per line:\n   '+mo.join('\n   '):''}`;
  if(type==='weekly')return `Create a 1080x1350 Instagram graphic for Belladonna, a live entertainment brand. ${STYLE}\n\nLayout:\n1. Small gold line: "THIS WEEK AT BELLADONNA"\n2. Huge title: "${t.toUpperCase()}"\n3. One line under it: "[WEEK X OF 4: MONTH THEME NAME]"\n4. This week's nights, one per line:${wk.length?'\n   '+wk.join('\n   '):' "[DAY], [VENUE], [EVENT]"'}\n5. Gold line: "Costume = bonus card. Theme costume = bonus stamp."\n6. Small footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD].`;
  if(type==='count'){
    const m=title.match(/^Countdown, (.*?): (.*)$/);
    const when=m?(m[1]==='day of'?'TONIGHT':m[1].toUpperCase()):'[N DAYS]';
    return `Create a 1080x1350 Instagram graphic for Belladonna, a live entertainment brand. ${STYLE}\n\nLayout:\n1. Small gold line: "BELLADONNA COUNTDOWN"\n2. Huge title: "${when}"\n3. Event name: "${m?m[2]:ev}"\n4. Details: "[DAY, DATE] · [TIME] · [VENUE]"\n5. Gold line: "Dress in the theme. Or any costume."\n6. Small footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD].`;
  }
  if(type==='cover')return `Create a 1920x1005 Facebook Event cover for Belladonna, a live entertainment brand. ${STYLE}\n\nText, large and centered with a clear safe margin:\n1. Small gold line: "BELLADONNA PRESENTS"\n2. Huge title: "${ev.toUpperCase()}"\n3. Details: "[DAY, DATE] · [TIME] · [VENUE]"\n4. Small line: "Dress in the theme. Or any costume."\n\nMood: [ONE LINE OF MOOD].`;
  if(type==='recap')return `Create a 1080x1350 Instagram graphic for Belladonna, a live entertainment brand. ${STYLE}\n\nLayout:\n1. Small gold line: "BELLADONNA RECAP"\n2. Huge title: "${t.toUpperCase()}"\n3. Subtitle: "CROWN WINNERS"\n4. Winner names, one per line, exactly as written here:\n${(date?winLines(date.slice(0,7),true):[]).join("\n")||"[WEEK 1 WINNER] to [FINALE WINNER]"}\n5. Empty framed area for a photo collage\n6. Gold line: "Next month: [NEXT MONTH THEME]"\n7. Small footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD].`;
  return `Create a graphic for Belladonna, a live entertainment brand, for this post: "${title}". ${STYLE}\n\nText: "[TEXT]". Footer: belladonnanights.com\n\nMood: [ONE LINE OF MOOD].`;
}

function normApi(v){

/* ── CADENCE RULES: the schedule lines create the posts ── */
const RULE_DEFAULTS={
  monthly:{kind:'monthly_day',day:25,time:'12:00'},
  weekly:{kind:'weekday',weekday:1,time:'11:00'},
  cover:{kind:'before_event',offsets:[14],time:'12:00'},
  count:{kind:'before_event',offsets:[7,3,0],time:'12:00'},
  recap:{kind:'month_end',time:'12:00'},
  rook:{kind:'weekday',weekday:3,time:'12:00'},
  crowd:{kind:'weekday',weekday:5,time:'17:00'},
  note:{kind:'weekday',weekday:0,time:'12:00'},
  tonight:{kind:'hq'},host:{kind:'hq'},best:{kind:'hq'}
};
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const _nw=(wd,weeks,time)=>({kind:'nth_week',weekday:wd,weeks,time:time||'12:00'});
const BANK_CAD={
  quotes:{rule:_nw(2,[1,3,5]),why:'Tuesdays, weeks 1, 3, 5'},memes:{rule:_nw(2,[2,4]),why:'Tuesdays, weeks 2 and 4'},
  rookasks:{rule:_nw(4,[1,3,5])},confess:{rule:_nw(4,[2,4])},
  crowdv:{rule:_nw(6,[1,3,5],'17:00')},vibe:{rule:_nw(6,[2,4],'17:00')},
  rooksays:{rule:_nw(3,[1,3,5])},crow:{rule:_nw(3,[2,4])},
  inside:{rule:_nw(0,[1])},debates:{rule:_nw(0,[2])},hostspot:{rule:_nw(0,[3])},collage:{rule:_nw(0,[4])},
  bestm:{freq:'With the Monthly Recap, last day of every month'},
  event:{freq:'As needed: 3 to 5 days before any gig or special event that is not a Big Night'},
  reels:{freq:'Every other Friday, instead of the photo for the Live Photo or Reel post'},
  stories:{freq:'Any non-event night. Event nights already get Tonight and Host stories'}
};
function bankCadList(){return Object.entries(bankData()).map(([c,v])=>({id:'bk:'+c,bank:true,cat:c,name:v.name,nick:v.badge||'',group:'Content bank posts',canvas:v.canvas||'',badge:v.badge||'',use:v.cadUse||'',size:'',freq:v.freq||(BANK_CAD[c]||{}).freq||'',silenced:!!v.silenced,deleted:false,custom:false,pt:v.canvas==='cv_scroll'?'note':'rook'}));}
function cadAll(){return libList().filter(e=>!e.id.startsWith('cv_')).concat(bankCadList());}
function cadEnt(id){return libList(true).find(x=>x.id===id)||bankCadList().find(x=>x.id===id);}
function ruleOf(id){if(String(id).startsWith('bk:')){const c=bankData()[id.slice(3)];return (c&&c.rule)||(BANK_CAD[id.slice(3)]||{}).rule||{kind:'none'};}const o=libOv[id]||{};return o.rule||RULE_DEFAULTS[id]||{kind:'none'};}
function describeRule(r){
  if(!r)return '';
  if(r.kind==='monthly_day')return 'The '+r.day+ordSuf(r.day)+' of every month';
  if(r.kind==='weekday')return 'Every '+WD[r.weekday];
  if(r.kind==='nth_week'){const w=(r.weeks||[]).slice().sort();return (w.length>1?'Weeks ':'Week ')+(w.length>2?w.slice(0,-1).join(', ')+' and '+w[w.length-1]:w.join(' and '))+' of each month, '+WD[r.weekday]+'s';}
  if(r.kind==='month_end')return 'Last day of every month';
  if(r.kind==='before_event')return (r.offsets||[]).map(o=>o===0?'the day of':o+' days before').join(', ')+' each big night';
  if(r.kind==='hq')return 'Automatic from HQ';
  return '';
}
function weekOfMonth(ds){const d=new Date(ds+'T12:00:00'),back=(d.getDay()+6)%7,m=new Date(d);m.setDate(d.getDate()-back);return Math.ceil(m.getDate()/7);}
function ordSuf(n){n=+n;return (n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');}
function lastDay(y,m){return new Date(y,m,0).getDate();}
function monthLong(m){return new Date(m+'-15T12:00:00').toLocaleDateString('en-US',{month:'long'});}
function nextMonthKey(date){const d=new Date(date.slice(0,7)+'-15T12:00:00');d.setMonth(d.getMonth()+1);return ymd(d).slice(0,7);}

/* campaign themes: override first, else read from the posts already on the calendar */
function campMap(){return (libOv.campaigns||{}).map||{};}
function derivedWeeks(m){
  return posts.filter(p=>p.type==='weekly'&&p.date.startsWith(m)&&/^Weekly graphic:/.test(p.title)).sort(sortFn).map(p=>p.title.replace(/^Weekly graphic:\s*/,''));
}
function derivedTheme(m){
  const L=monthLong(m),p=posts.find(x=>x.type==='monthly'&&x.title.includes('('+L+')'));
  if(!p)return '';
  const t=p.title.split(': ').slice(1).join(': ').replace(/\s*\([A-Za-z]+\)\s*$/,'');return t;
}
function campInfo(m){
  const o=campMap()[m]||{},dw=derivedWeeks(m);
  return {theme:o.theme!==undefined?o.theme:derivedTheme(m),weeks:[0,1,2,3].map(i=>(o.weeks&&o.weeks[i]!==undefined)?o.weeks[i]:(dw[i]||''))};
}
function mondaysOf(m){const out=[];const n=lastDay(+m.slice(0,4),+m.slice(5));for(let d=1;d<=n;d++){const ds=m+'-'+pad(d);if(new Date(ds+'T12:00:00').getDay()===1)out.push(ds);}return out;}

function genTitle(id,name,date,ctx){
  const ev=ctx&&ctx.ev;
  if(id==='monthly'){const nm=nextMonthKey(date),th=campInfo(nm).theme;return 'Monthly announcement, 3 slides: '+(th?th+' ('+monthLong(nm)+')':monthLong(nm));}
  if(id==='weekly'){const m=date.slice(0,7),i=mondaysOf(m).indexOf(date),th=i>=0&&i<4?campInfo(m).weeks[i]:'';return th?'Weekly graphic: '+th:'Weekly nights graphic (no costume theme)';}
  if(id==='cover')return 'Facebook Event: '+ev;
  if(id==='count')return ctx.off===0?'Countdown, day of: '+ev:'Countdown, '+ctx.off+' days: '+ev;
  if(id==='recap')return 'Monthly recap: '+monthLong(date.slice(0,7));
  if(id==='rook'||id==='crowd'||id==='note')return name;
  return name+(ev?': '+ev:'');
}
function planGen(){
  const t=todayStr(),end=addDays(t,60),out=[];
  const skip=new Set((libOv.gen||{}).skip||[]),have=new Set(posts.map(p=>p.genKey).filter(Boolean));
  const taken=(type,date,label)=>posts.some(p=>p.type===type&&p.date===date&&(!label||p.title.includes(label)))||out.some(p=>p.type===type&&p.date===date&&(!label||p.title.includes(label)));
  const add=(e,date,time,anchor,off,ctx,label)=>{
    if(date<t||date>end)return;
    const key=e.id+'|'+anchor+'|'+(off===undefined?'':off),pt=e.pt||e.id;
    if(have.has(key)||skip.has(key))return;
    if(taken(pt,date,label||(e.bank?e.name:'')))return;
    out.push({id:'r_'+key.replace(/[^a-z0-9]+/gi,'_'),date,time:time||'12:00',type:pt,title:genTitle(e.id,e.name,date,{...ctx,off}),
      platform:(TYPES[pt]&&TYPES[pt].plat)||'IG + FB',caption:'',imageUrl:'',notes:'',created:false,posted:false,gen:true,genKey:key,...(e.bank?{bankCat:e.cat}:{})});
  };
  const bigs=posts.filter(p=>p.type==='big');
  cadAll().forEach(e=>{
    if(e.silenced)return;
    const r=ruleOf(e.id);if(!r||r.kind==='none'||r.kind==='hq')return;
    if(r.kind==='monthly_day'){
      let d=new Date(t.slice(0,7)+'-01T12:00:00');
      for(let i=0;i<4;i++){const y=d.getFullYear(),m=d.getMonth()+1,day=Math.min(+r.day||1,lastDay(y,m));add(e,y+'-'+pad(m)+'-'+pad(day),r.time,y+'-'+pad(m),undefined,{});d.setMonth(d.getMonth()+1);}
    }else if(r.kind==='weekday'){
      for(let ds=t;ds<=end;ds=addDays(ds,1)){if(new Date(ds+'T12:00:00').getDay()===+r.weekday)add(e,ds,r.time,ds,undefined,{});}
    }else if(r.kind==='nth_week'){
      const wk=r.weeks||[];
      for(let ds=t;ds<=end;ds=addDays(ds,1)){if(new Date(ds+'T12:00:00').getDay()===+r.weekday&&wk.includes(weekOfMonth(ds)))add(e,ds,r.time,ds,undefined,{});}
    }else if(r.kind==='month_end'){
      let d=new Date(t.slice(0,7)+'-01T12:00:00');
      for(let i=0;i<4;i++){const y=d.getFullYear(),m=d.getMonth()+1;add(e,y+'-'+pad(m)+'-'+pad(lastDay(y,m)),r.time,y+'-'+pad(m),undefined,{});d.setMonth(d.getMonth()+1);}
    }else if(r.kind==='before_event'){
      bigs.forEach(b=>(r.offsets||[]).forEach(off=>{
        const label=e.id==='count'?(off===0?'day of':off+' days'):'';
        add(e,addDays(b.date,-off),r.time,b.date,off,{ev:evTitle(b)},label);
      }));
    }
  });
  planRemove=[];
  out.filter(b=>b.bankCat).forEach(b=>{
    const gname=(libList().find(e=>e.id===b.type)||{}).name;if(!gname)return;
    for(let i=out.length-1;i>=0;i--)if(out[i].type===b.type&&out[i].date===b.date&&!out[i].bankCat&&out[i].title===gname)out.splice(i,1);
    posts.filter(x=>x.type===b.type&&x.date===b.date&&x.gen&&!x.bankCat&&!x.created&&!x.posted&&x.title===gname).forEach(x=>planRemove.push(x.id));
  });
  return out;
}
let planRemove=[];
async function runGen(manual){
  if(!manual&&(libOv.settings||{}).autoGen===false)return;
  const L=planGen();
  if(!L.length){if(manual)toast('Nothing new to create');return;}
  for(const id of planRemove)await removePost(id);
  L.forEach(p=>quietSave(p));
  render();
  toast(L.length+' post'+(L.length>1?'s':'')+' created from your cadence');
}

async function libSaveEdit(){

    if(k==='before_event')patch.rule.offsets=$('le-offs').value.split(',').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x)&&x>=0);}
  if(ledId&&String(ledId).startsWith('bk:')){const c=ledId.slice(3),cats=bankData();if(!cats[c])return;

const DEFAULT_MUSE=`I'm attaching a TEMPLATE image. Use it as an exact template for every graphic: keep the artwork, frames, flowers, fonts, colors, gold texture, layout and image size identical. Change ONLY the wording (and the picture, when I ask for one). Do not redesign it or add anything new.

Make one PNG for each post I list at the bottom. Give me each one as its own PNG file, in the order listed. Spell every word exactly as I wrote it.

HOW TO READ MY POSTS:
- Each line is its own post.
- Text inside ** ** (double asterisks) is a PICTURE I want on that design, not words. Draw that image in the style of the template and do NOT print the words inside the asterisks.
  Example: Confidence level after 3 drinks: **image of singing crow**. Liquid Courage: Unlocked.
  -> One PNG. The words "Confidence level after 3 drinks:" and "Liquid Courage: Unlocked." go on the design, with a singing crow illustration.
  Example: Waiting for my turn to sing. **Image of a skeleton holding a beer**
  -> One PNG with the words "Waiting for my turn to sing." and a skeleton holding a beer.
- Text inside [ ] (square brackets) means the post is a carousel, and each bracketed item is its own separate PNG. Make the carousel like this:
  1) FIRST PNG = the cover slide. It shows ONLY the words before the first bracket (the header) as the big main text. Nothing else on it.
  2) Then ONE PNG for each bracketed item, in order. Each of these shows ONLY that bracketed item (without its brackets) as the big main text. Do NOT repeat the header on these slides.
  Example: Songs that trigger the bar: [Mr. Brightside], [Don't Stop Believing], [Sweet Caroline], [Man, I Feel Like A Woman], [Bohemian Rhapsody]

let bankWeek=0;
function bankMonday(off){const t=todayStr(),back=(new Date(t+'T12:00:00').getDay()+6)%7;return addDays(t,-back+7*(off||0));}
function bankWeekLabel(off){const a=bankMonday(off),b=addDays(a,6),f=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});return f(a)+' to '+f(b);}
function liveDetails(off){
  const a=bankMonday(off),b=addDays(a,6),m=a.slice(0,7);
  const L=[];
  const nights=gigs.filter(g=>isPublicGig(g)&&g.date>=a&&g.date<=b).sort((x,y)=>(x.date+(t24(x.time)||'99'))<(y.date+(t24(y.time)||'99'))?-1:1);
  L.push('LIVE DETAILS FROM HQ (use these exact facts on the graphic wherever the post needs them. Do not invent or change any day, venue, game or time):');
  L.push('Week: '+bankWeekLabel(off)+' (Monday to Sunday)');
  if(gigs.length){
    const venues=[...new Set(nights.map(g=>g.venue))];
    L.push('Nights this week: '+nights.length+(nights.length?' across '+venues.length+' venue'+(venues.length===1?'':'s'):''));
    if(nights.length){
      L.push('Schedule:');
      nights.forEach(g=>{const tm=t24(g.time);L.push('- '+DN[new Date(g.date+'T12:00:00').getDay()].toUpperCase()+' '+new Date(g.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})+': '+String(g.venue||'').toUpperCase()+(g.city?' ('+g.city+')':'')+', '+(g.kind||'')+(tm?', starts '+fmtTime(tm):', time not set'));});
      const days=[...new Set(nights.map(g=>DN[new Date(g.date+'T12:00:00').getDay()]))];
      L.push('Days with a night: '+days.join(', ')+' ('+days.length+' day'+(days.length===1?'':'s')+')');
    }
  }else L.push('(HQ schedule has not loaded, so no nights are listed. Open Clio while signed in and try again.)');
  const ci=campInfo(m),i=mondaysOf(m).indexOf(a);
  if(ci.theme)L.push('Month theme: '+ci.theme);
  if(i>=0&&i<4&&ci.weeks[i])L.push('Costume theme this week (week '+(i+1)+' of 4): '+ci.weeks[i]);
  const big=posts.filter(p=>p.type==='big'&&p.date>=todayStr()).sort(sortFn)[0];
  if(big){const g=gigs.find(x=>'hqbig_'+x.id===big.id),tm=big.time?', '+fmtTime(big.time):'';L.push('Next big night: '+evTitle(big)+' on '+dayName(big.date).replace(/, \d{4}$/,'')+tm+(g&&g.venue?' at '+g.venue:'')+' ('+daysAway(big.date).toLowerCase()+')');}
  const w=winLines(m,false);
  if(w.length)L.push('Best Dressed winners so far this month:\n'+w.map(x=>'- '+x).join('\n'));
  L.push('Footer: belladonnanights.com');
  return L.join('\n');
}

const LEGACY_TITLES={rook:'Wednesday Rook / Snark post',crowd:'Friday: post a live crowd photo or reel',note:'Sunday Tavern Scroll note'};
async function migrateTitles(){

async function syncBuffer(manual){
  if(bufBusy)return;
  const stored=getApi();
  if(!manual&&!stored)return;
  const t=todayStr();
  const cand=posts.filter(p=>!isMile(p)&&(p.caption||'').trim()&&!p.posted&&p.date<=addDays(t,1));
  if(!cand.length){if(manual)toast('Nothing is waiting to be marked posted');return;}
  bufBusy=true;
  try{
    const since=addDays(cand.map(p=>p.date).sort()[0],-1)+'T00:00:00Z';
    const d=await apiFetch('/buffer/sent?since='+encodeURIComponent(since),{method:'GET'});
    const norm=x=>String(x||'').replace(/\s+/g,' ').trim().toLowerCase();
    const near=(p,b)=>Math.abs((new Date(ymd(new Date(b.dueAt))+'T12:00:00')-new Date(p.date+'T12:00:00'))/864e5)<=1;
    const same=(p,b)=>{const a=norm(p.caption),c=norm(b.text);return a===c||(a.length>40&&c.length>40&&a.slice(0,80)===c.slice(0,80));};
    let done=0,failed=0;
    for(const p of cand){
      if((d.sent||[]).some(b=>same(p,b)&&near(p,b))){await persist({...p,created:true,scheduled:true,posted:true});done++;}
      else if((d.failed||[]).some(b=>same(p,b)&&near(p,b)))failed++;
    }
    if(done||failed||manual)toast((done?done+' marked posted from Buffer':'Nothing new from Buffer')+(failed?` · ${failed} failed in Buffer, check it`:''));
  }catch(e){if(manual)toast('Buffer sync failed: '+e.message);}
  bufBusy=false;
}

  const top=`<div class="bar">${chip('template','By template')}${chip('use','By use')}${chip('inventory','Inventory')}<div class="sp"></div><button class="btn btn-p" data-act="tplnew">+ New template</button></div>`;
  const hd=head('Templates','Every look, its words and how often you post it, in one place. Switch the grouping to find things your way.');
  if(view==='inventory'){$('view').innerHTML=hd+top.replace(/<button class="btn btn-p"[^>]*>\+ New template<\/button>/,'')+invHtml();return;}
  const details=`<div class="bar"><span class="meta" style="margin:0">Details for graphics:</span><span class="meta" style="margin:0">Night</span><input type="date" id="bkday" value="${bankDay}" style="width:auto;padding:5px 10px"/><span class="meta" style="margin:0">Week</span><select class="mini" id="bkwk">${[[-1,'Last week'],[0,'This week'],[1,'Next week'],[2,'Week after next']].map(([o,l])=>`<option value="${o}" ${bankWeek===o?'selected':''}>${l} (${bankWeekLabel(o)})</option>`).join('')}</select></div>`;
  if(view==='schedule'){$('view').innerHTML=hd+top+details+tplScheduleHtml()+tplSettingsHtml();return;}
  const [pills,mgmt,cards]=view==='use'?tplUseParts(list):tplTemplateParts(list);
  const empty=(tplDue&&!list.length)?'<div class="empty">Nothing is due in the next 7 days.</div>':'';
  $('view').innerHTML=hd+top+mgmt+details+cards+empty+tplSettingsHtml();
}
/* ═══ INVENTORY: how many ready-to-post posts you have per kind. Goes down when you tick Sched on a matching post. ═══ */
function invItems(){return (libOv.inventory||{}).items||{};}
async function invSave(items){await saveLib('inventory',{items},true);}
function invMatch(p){
  const it=Object.entries(invItems()),cat=(p.bankRef||'').split('|')[0];
  return it.find(([,v])=>v.cat&&cat&&v.cat===cat)||it.find(([,v])=>!v.cat&&v.type&&v.type===p.type)||null;
}
function invAdjust(p,delta){
  const m=invMatch(p);if(!m)return;
  const items=JSON.parse(JSON.stringify(invItems())),v=items[m[0]];
  v.count=Math.max(0,(+v.count||0)+delta);
  invSave(items);
  const low=+v.low||0;
  toast(v.name+': '+v.count+' left'+((delta<0&&low&&v.count<=low)?'. Running low, time to make more':''));
}
function invLow(){return Object.entries(invItems()).filter(([,v])=>(+v.low||0)>0&&(+v.count||0)<=(+v.low||0));}
function vInventory(){$('view').innerHTML=head('Inventory','Stock of finished posts.')+invHtml();}
function invHtml(){
  const items=Object.entries(invItems()),cats=Object.entries(bankData()),types=libList().filter(e=>!e.id.startsWith('cv_')),low=invLow();
  const openMap=(libOv.tplui||{}).invOpen||{};
  const row=([id,v])=>{
    const n=+v.count||0,isLow=(+v.low||0)>0&&n<=(+v.low||0),open=!!openMap[id];
    const head=`<div data-act="ivfold" data-arg="${id}" style="cursor:pointer;display:flex;gap:10px;align-items:center"><span style="color:var(--gold2);width:12px">${open?'▾':'▸'}</span><div style="flex:1;min-width:0"><b style="font-weight:600;font-size:.92rem">${esc(v.name||'Untitled')}</b></div><div style="text-align:right;flex-shrink:0"><b style="font-size:1.05rem;color:${isLow?'var(--rose)':'var(--gold2)'}">${n}</b> <span class="has" style="display:inline">in stock${isLow?' · running low':''}</span></div></div>`;
    if(!open)return `<div class="card" style="padding:10px 12px;margin-bottom:6px;${isLow?'border-color:var(--rose)':''}">${head}</div>`;
    return `<div class="card" style="margin-bottom:8px;${isLow?'border-color:var(--rose)':''}">${head}<div style="margin-top:10px">
      <div class="f" style="max-width:520px"><label>What it is</label><input type="text" data-iv="${id}" data-f="name" value="${esc(v.name||'')}" placeholder="Bar Truths (Snark card)"/></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><button class="btn btn-g" data-act="ivadj" data-arg="${id}|-1">−1</button><button class="btn btn-g" data-act="ivadj" data-arg="${id}|1">+1</button>
        <input type="text" inputmode="numeric" id="iva-${id}" placeholder="Made" style="width:80px"/><button class="btn btn-p" data-act="ivadd" data-arg="${id}">Add to stock</button></div>
      <div class="f2"><div class="f"><label>Warn me at or below</label><input type="text" inputmode="numeric" data-iv="${id}" data-f="low" value="${esc(v.low||'')}" placeholder="5"/></div>
        <div class="f"><label>Counts down when I tick Sched on a post using this bank category</label><select data-iv="${id}" data-f="cat"><option value="">(none)</option>${cats.map(([c,x])=>`<option value="${c}" ${v.cat===c?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
        <div class="f"><label>Or on any post of this type</label><select data-iv="${id}" data-f="type"><option value="">(none)</option>${types.map(e=>`<option value="${e.id}" ${v.type===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div></div>
      <div class="acts" style="margin-top:0">${(v.cat&&bankData()[v.cat])?`<button class="btn btn-gold" data-act="ivmake" data-arg="${id}">Make more</button>`:''}<button class="btn btn-d" data-act="ivdel" data-arg="${id}">Delete</button></div></div></div>`;
  };
  return `<div class="sub" style="margin-top:0">How many finished posts you have in stock. The number drops by one each time you tick Sched on a matching post, and goes back up if you untick it.</div>`+
    (low.length?`<div class="banner err">Running low: ${low.map(([,v])=>esc(v.name)+' ('+(+v.count||0)+')').join(', ')}</div>`:'')+
    `<div class="bar"><button class="btn btn-p" data-act="ivnew">+ Add inventory</button></div>`+
    (items.length?items.map(row).join(''):'<div class="empty">Nothing tracked yet. Add one, like "Bar Truths", type how many you made, and link it to its bank category so it counts down on its own.</div>')+
    `<div class="meta" style="margin-top:8px">Linking: a post counts against an item when its Content Bank text came from the linked category (pick it in the post window), or, if no category is linked, when the post is the linked type.</div>`;
}
function ivAct(a,arg){
  if(a==='ivfold'){const o={...((libOv.tplui||{}).invOpen||{})};if(o[arg])delete o[arg];else o[arg]=true;saveLib('tplui',{invOpen:o},true).then(render);return;}
  const items=JSON.parse(JSON.stringify(invItems()));
  if(a==='ivnew'){const nid='i'+Date.now().toString(36);items[nid]={name:'New item',count:0,low:5,cat:'',type:''};saveLib('tplui',{invOpen:{...((libOv.tplui||{}).invOpen||{}),[nid]:true}},true);}
  else if(a==='ivdel'){if(!confirm('Delete "'+(items[arg]||{}).name+'"?'))return;delete items[arg];}
  else if(a==='ivadj'){const[id,d]=arg.split('|');if(!items[id])return;items[id].count=Math.max(0,(+items[id].count||0)+(+d));}
  else if(a==='ivadd'){const el=$('iva-'+arg),n=parseInt(String(el&&el.value).replace(/[^\d-]/g,''));if(!n||!items[arg]){toast('Type how many you made');return;}items[arg].count=Math.max(0,(+items[arg].count||0)+n);toast(items[arg].name+': '+items[arg].count+' in stock');}
  else if(a==='ivmake'){const v=items[arg],c=v&&bankData()[v.cat];if(!c)return;
    const o={...((libOv.bank||{}).open||{})};o[v.cat]=true;const t={...((libOv.tplui||{}).open||{})};t[c.canvas||'_none']=true;
    saveLib('bank',{open:o},true).then(()=>saveLib('tplui',{open:t},true)).then(()=>saveLib('settings',{tplViewV2:'template'},true)).then(()=>{tplGrp='all';setTab('templates');});return;}
  invSave(items).then(render);
}
function ivChange(t){
  if(t.tagName==='SELECT'){t.blur();editing=false;pendingRender=false;}
  const items=JSON.parse(JSON.stringify(invItems())),v=items[t.dataset.iv];if(!v)return;
  const f=t.dataset.f;
  if(f==='count'||f==='low')v[f]=Math.max(0,parseInt(String(t.value).replace(/[^\d]/g,''))||0);else v[f]=t.value.trim();
  invSave(items).then(render);
}

/* ── BUFFER CSV EXPORT (Buffer's bulk upload: Text, Image URL, Tags, Posting Time) ── */
function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"';}
function dlCsv(name,rows){
  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function exportBuffer(){
  const t=todayStr();
  const list=posts.filter(p=>!isMile(p)&&p.type!=='tonight'&&p.type!=='host'&&!p.posted&&!p.scheduled&&p.date>=t).sort(sortFn);
  const ready=list.filter(p=>(p.caption||'').trim());
  const noCap=list.length-ready.length;
  const ig=ready.filter(p=>/IG/.test(p.platform||'')&&!/Story/.test(p.platform||'')&&(p.imageUrl||'').trim());
  const igNoImg=ready.filter(p=>/IG/.test(p.platform||'')&&!/Story/.test(p.platform||'')&&!(p.imageUrl||'').trim()).length;
  const fb=ready.filter(p=>/FB/.test(p.platform||'')&&!/Event/.test(p.platform||''));
  if(!ig.length&&!fb.length){toast('Nothing is ready yet: posts need a caption (and an image for Instagram)');return;}
  const head=['Text','Image URL','Tags','Posting Time'].map(csvCell).join(',');
  const when=p=>`${p.date} ${p.time||'12:00'}`;
  if(ig.length)dlCsv('clio-buffer-instagram-'+t+'.csv',[head,...ig.map(p=>[p.caption.trim()+((p.hashtags||'').trim()?'\n\n'+p.hashtags.trim():''),p.imageUrl,'',when(p)].map(csvCell).join(','))]);
  if(fb.length)setTimeout(()=>dlCsv('clio-buffer-facebook-'+t+'.csv',[head,...fb.map(p=>[p.caption.trim(),p.imageUrl||'','',when(p)].map(csvCell).join(','))]),600);
  toast(`Instagram ${ig.length} · Facebook ${fb.length}`+(noCap?` · ${noCap} skipped (no caption)`:'')+(igNoImg?` · ${igNoImg} Instagram posts need an image`:''));
}
