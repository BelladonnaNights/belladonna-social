<title>Belladonna Clio</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* HQ is the canonical style: black + gold. Light mode uses the Planner's cream palette. */
:root{
  --bg:#000000;--surface:#0d0d0d;--surface2:#141414;--surface3:#1a1a1a;--surface4:#212121;
  --border:rgba(180,150,100,0.16);--border2:rgba(180,150,100,0.34);--border-gold:rgba(201,169,110,0.4);
  --gold:#c9a96e;--gold2:#e0bc7e;--gold-dim:rgba(201,169,110,0.12);
  --gold-shine:linear-gradient(135deg,#c9a84c 0%,#f5df90 45%,#c9a84c 70%,#e2b84a 100%);
  --live:#3a9a5a;--live-dim:rgba(58,154,90,0.14);--rose:#b0505a;--rose-dim:rgba(176,80,90,0.16);
  --text:#f0ece0;--text2:#b8ad98;--text3:#8a8272;--text4:#4a4638;
  --btn-text:#000;--nav-bg:#000;
  --radius:8px;--rl:12px;
  --display:'Bebas Neue',sans-serif;--cinzel:'Cinzel',serif;--serif:'EB Garamond',serif;--font:'DM Sans',sans-serif;
}
:root[data-theme="light"]{
  --bg:#faf6ec;--surface:#ffffff;--surface2:#f6efe0;--surface3:#ede2c8;--surface4:#e4d7b6;
  --border:rgba(40,30,10,.10);--border2:rgba(40,30,10,.18);--border-gold:rgba(169,127,34,.5);
  --gold:#a97f22;--gold2:#8c6a1e;--gold-dim:rgba(169,127,34,.12);
  --gold-shine:linear-gradient(135deg,#a97f22 0%,#c99a30 45%,#a97f22 70%,#93711c 100%);
  --live:#2f7a47;--live-dim:rgba(47,122,71,.14);--rose:#a43a45;--rose-dim:rgba(164,58,69,.12);
  --text:#2a2118;--text2:#5c4f3e;--text3:#8a7a63;--text4:#b8a98c;
  --btn-text:#fff;--nav-bg:#faf6ec;
}
html,body{min-height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:300;letter-spacing:.04em;overflow-x:hidden;}
input[type=checkbox]{accent-color:var(--gold);}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.nav{background:var(--nav-bg);padding:0 1.25rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;height:62px;}
.gold-line{height:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);position:sticky;top:62px;z-index:49;}
.logo-group{display:flex;flex-direction:column;line-height:1;flex-shrink:0;}
.logo{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;color:var(--text);text-transform:uppercase;}
.logo-sub{font-family:var(--cinzel);font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:3px;}
.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:21px 1rem;font-family:var(--cinzel);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--text3);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;white-space:nowrap;transition:all .2s;}
.tab:hover{color:var(--text2)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);}
.mode{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--border2);color:var(--text3);white-space:nowrap;flex-shrink:0;}
.mode.cloud{color:var(--live);border-color:var(--live);}
.mode.local{color:var(--gold);border-color:var(--border-gold);}
.btn{cursor:pointer;font-family:var(--cinzel);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border-radius:var(--radius);padding:.55rem 1rem;border:none;white-space:nowrap;transition:all .2s;}
.btn-p{background:var(--gold-shine);color:var(--btn-text);}
.btn-p:hover{filter:brightness(1.08)}
.btn-g,.btn-gold{background:transparent;border:1px solid var(--border-gold);color:var(--gold);}
.btn-g:hover,.btn-gold:hover{background:var(--gold-dim)}
.btn-d{background:none;border:1px solid var(--rose);color:var(--rose);}
.wrap{max-width:980px;margin:0 auto;padding:1.25rem 1rem 4rem;}
.title{font-family:var(--display);font-size:2rem;letter-spacing:.05em;background:var(--gold-shine);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.sub{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text3);margin:2px 0 16px;letter-spacing:.01em;}
.banner{background:var(--gold-dim);border:1px solid var(--border-gold);border-radius:var(--rl);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.banner.err{background:var(--rose-dim);border-color:var(--rose);}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:8px 14px;min-width:96px;}
.stat b{display:block;font-family:var(--cinzel);font-size:18px;font-weight:600;color:var(--text);}
.stat span{font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
.stat.bad b{color:var(--rose)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.chip{padding:5px 13px;border-radius:999px;font-size:.65rem;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text3);font-family:var(--font);letter-spacing:.15em;text-transform:uppercase;font-weight:400;transition:all .2s;}
.chip:hover{border-color:var(--border2);color:var(--text2)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}
select,input[type=text],input[type=date],input[type=time],input[type=password],textarea{font-family:var(--font);font-size:13px;font-weight:400;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface3);color:var(--text);width:100%;}
select.mini{width:auto;font-size:12px;padding:5px 10px;border-radius:999px;color:var(--gold);}
textarea{resize:vertical;min-height:90px;line-height:1.5;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);}
.sec{font-size:.65rem;letter-spacing:.32em;text-transform:uppercase;color:var(--text3);font-weight:400;margin:20px 0 8px;}
.day{margin-bottom:14px;}
.dayh{font-family:var(--cinzel);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:4px 2px;border-bottom:1px solid var(--border);margin-bottom:6px;display:flex;gap:8px;align-items:center;}
.dayh .tag{font-size:8px;padding:1px 8px;border-radius:999px;letter-spacing:.08em;}
.dayh .today{background:var(--gold);color:var(--btn-text)}
.dayh .od{background:var(--rose-dim);color:var(--rose)}
.monthh{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;color:var(--gold);margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border2);}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--rl);margin-bottom:4px;cursor:pointer;transition:border-color .2s;}
.row:hover{border-color:var(--border-gold)}
.row.done{opacity:.6;border-left-color:var(--live)}
.row.od{border-left-color:var(--rose)}
.row.milestone{background:var(--gold-dim);border-color:var(--border-gold);}
.ck{display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--cinzel);font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);width:42px;flex-shrink:0;}
.ck input{width:17px;height:17px;cursor:pointer;}
.time{font-family:var(--cinzel);font-size:10px;color:var(--text3);width:52px;flex-shrink:0;}
.badge{font-size:9px;font-weight:600;padding:2px 9px;border-radius:999px;font-family:var(--cinzel);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;border:1px solid var(--border-gold);color:var(--gold2);}
.badge.hi{background:var(--gold-dim);}
.rt{flex:1;min-width:0;font-size:13px;font-weight:400;}
.rt small{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:13px;color:var(--text3);}
.has{font-size:10px;color:var(--text3);flex-shrink:0;font-family:var(--cinzel)}
.empty{font-family:var(--serif);font-style:italic;color:var(--text3);padding:1.5rem 0;text-align:center;font-size:15px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;}
.card h4{font-family:var(--cinzel);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;color:var(--gold);}
.card .meta{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text2);margin-bottom:8px;letter-spacing:.01em;}
.card .lbl{display:block;font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:8px 0 3px;}
.prog{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden;margin:6px 0;}
.prog i{display:block;height:100%;background:var(--gold-shine);}
.prog.posted i{background:var(--live);}
.nick{font-family:var(--cinzel);font-size:9px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;}
/* month grid */
.mnav{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mnav .mt{font-family:var(--display);font-size:1.6rem;letter-spacing:.06em;color:var(--gold);flex:1;text-align:center;}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.mh{font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);text-align:center;padding:4px 0;}
.mc{min-height:84px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px 5px;cursor:pointer;overflow:hidden;}
.mc:hover{border-color:var(--border-gold)}
.mc.out{opacity:.25;cursor:default;background:none;border-style:dashed}
.mc.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.md{font-size:11px;color:var(--text2);font-weight:400;}
.mc.today .md{color:var(--btn-text);background:var(--gold);display:inline-block;min-width:18px;text-align:center;border-radius:99px;font-weight:600;}
.mp{display:block;font-size:9px;font-family:var(--cinzel);letter-spacing:.04em;padding:1px 5px;margin-top:2px;border-radius:4px;background:var(--gold-dim);color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mp.done{background:var(--live-dim);color:var(--live)}
.mp.od{background:var(--rose-dim);color:var(--rose)}
.mp.big{background:var(--gold);color:var(--btn-text);font-weight:600}
.mp.more{background:none;color:var(--text3)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:1rem;}
.ov.show{display:flex}
.box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);width:100%;max-width:580px;max-height:92vh;overflow-y:auto;padding:1.25rem;}
.box h3{font-family:var(--cinzel);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;color:var(--gold);}
.f{margin-bottom:10px}
.f label{display:block;font-family:var(--cinzel);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.f2{display:flex;gap:8px}.f2>div{flex:1}
.checks{display:flex;gap:18px;margin:6px 0 12px;font-size:13px;color:var(--text2)}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.checks input{width:17px;height:17px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.sp{flex:1}
.tools{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--gold);color:var(--btn-text);font-size:11px;font-weight:700;padding:8px 20px;border-radius:999px;transition:transform .22s;pointer-events:none;z-index:999;font-family:var(--cinzel);letter-spacing:.08em;text-transform:uppercase;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0)}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;max-width:520px}
.gt{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,var(--surface3),var(--surface));border:1px solid var(--border);overflow:hidden;cursor:pointer}
.gt:hover{border-color:var(--border-gold)}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gtl{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:11px;color:var(--text2);line-height:1.3}
.gt img~.gtl{display:none}
.gtd{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-family:var(--cinzel);font-size:9px;letter-spacing:.06em;background:rgba(0,0,0,.65);color:var(--gold2);text-align:center}
@media(max-width:600px){.has{display:none}.time{width:44px}.badge{display:none}.mode{display:none}.logo{font-size:1.2rem}
  .mc{min-height:58px;padding:3px}.mp{font-size:0;padding:0;width:6px;height:6px;border-radius:50%;display:inline-block;margin:2px 1px 0 0}.mp.more{width:auto;font-size:8px;height:auto}}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo-group"><div class="logo">Belladonna</div><div class="logo-sub">Clio</div></div>
  <div class="tabs" id="tabs"></div>
  <span class="mode" id="mode">…</span>
  <button class="btn btn-g" id="th" data-act="theme">☀ Light</button>
  <button class="btn btn-g" id="so" data-act="signout" style="display:none">Sign out</button>
  <button class="btn btn-p" data-act="new">+ Post</button>
</nav>
<div class="gold-line"></div>
<div class="wrap"><div id="banner"></div><div id="view"></div></div>

<div class="ov" id="ov" onclick="if(event.target===this)closeEdit()">
  <div class="box">
    <h3 id="mt">Post</h3>
    <div class="f2">
      <div class="f"><label>Date</label><input type="date" id="f-date"/></div>
      <div class="f"><label>Time</label><input type="time" id="f-time"/></div>
    </div>
    <div class="f2">
      <div class="f"><label>Template</label><select id="f-type"></select></div>
      <div class="f"><label>Where</label><input type="text" id="f-plat" placeholder="IG + FB"/></div>
    </div>
    <div class="f"><label>What it is</label><input type="text" id="f-title"/></div>
    <div class="f"><label>Caption (goes to Buffer)</label><textarea id="f-cap"></textarea>
      <div class="tools" style="margin:6px 0 0"><button class="btn btn-g" type="button" id="b-cap" onclick="aiCaption()">Write caption (ChatGPT)</button></div>
      <div id="f-tags" class="bar" style="margin:6px 0 0"></div></div>
    <div class="f"><label>Image (upload, or paste a direct .jpg / .png link)</label><input type="text" id="f-img" placeholder="https://…" oninput="imgPrev()"/>
      <div class="tools" style="margin:6px 0 0"><button class="btn btn-g" type="button" id="b-up" onclick="document.getElementById('f-file').click()">Upload image</button><input type="file" id="f-file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadImg(this)"/></div>
      <img id="f-prev" alt="" style="display:none;max-width:140px;max-height:140px;margin-top:8px;border:1px solid var(--border2);border-radius:var(--radius)"/></div>
    <div class="f" id="f-win" style="display:none"></div>
    <div class="f"><label>Notes</label><input type="text" id="f-notes"/></div>
    <div class="checks">
      <label><input type="checkbox" id="f-created"/> Made</label>
      <label><input type="checkbox" id="f-posted"/> Posted</label>
    </div>
    <div class="tools">
      <button class="btn btn-gold" onclick="muse()">✦ The Muse: build ChatGPT prompt</button>
      <button class="btn btn-gold" onclick="openGfx()">▣ Make graphic</button>
      <button class="btn btn-gold" id="f-enc" onclick="encore()">↻ Encore: duplicate</button>
    </div>
    <div class="f" id="f-muse-wrap" style="display:none"><label>Prompt (copied to clipboard, edit the [brackets])</label><textarea id="f-muse" style="min-height:200px"></textarea></div>
    <div class="acts">
      <button class="btn btn-d" id="f-del" onclick="delPost()">Delete</button>
      <div class="sp"></div>
      <button class="btn btn-g" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-p" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

  LIB_SEED.forEach(t=>{
    const o=libOv[t.id]||{},m=LIB_META[t.id]||{};
    const e={...t,...m,custom:false};
    LIB_FIELDS.forEach(f=>{if(o[f]!==undefined&&o[f]!==null)e[f]=o[f];});
    e.deleted=!!o.deleted;out.push(e);
  });
  Object.entries(libOv).forEach(([id,o])=>{
    if(o&&o.custom){const e={id,custom:true,name:o.name||'Untitled',nick:o.nick||'',size:o.size||'',use:o.use||'',group:o.group||'Other',freq:o.freq||'',deleted:!!o.deleted};out.push(e);}
  });
  return withDeleted?out:out.filter(e=>!e.deleted);
}
let typeSig='';
function syncTypes(){
  libList(true).forEach(e=>{
    if(e.deleted)return;

  });
  const sig=Object.entries(TYPES).map(([k,v])=>k+':'+v.l).join('|');
  if(sig!==typeSig){typeSig=sig;if(typeof buildTypeOptions==='function')buildTypeOptions();}
}

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function buildSeed(){
  const out=[];
  SEED.trim().split('\n').forEach(line=>{
    const m=line.trim().match(/^(\d{4}-\d{2}-\d{2})\s+([A-Z0-9]+)(?:@(\d{2}:\d{2})?)?\s*(.*)$/);
    if(!m)return;
    const [,date,code,atTime,rest]=m;
    const hasAt=line.includes('@');
    let type,title,time;
    switch(code){
      case 'W':type='weekly';title='Weekly graphic: '+rest;time='11:00';break;
      case 'N':type='weekly';title='Weekly nights graphic (no costume theme)';time='11:00';break;
      case 'M':type='monthly';title='Monthly announcement, 3 slides: '+rest;time='12:00';break;
      case 'C':type='cover';title='Facebook Event: '+rest;time='12:00';break;
      case 'K7':type='count';title='Countdown, 7 days: '+rest;time='12:00';break;
      case 'K3':type='count';title='Countdown, 3 days: '+rest;time='12:00';break;
      case 'K0':type='count';title='Countdown, day of: '+rest;time='12:00';break;
      case 'R':type='recap';title='Monthly recap: '+rest;time='12:00';break;
      case 'B':type='big';title='Big night: '+rest;time='';break;
      default:return;
    }
    if(hasAt)time=atTime||'';
    out.push({id:`s_${date}_${code}_${slug(rest||'nights')}`,date,time,type,title,
      platform:TYPES[type].plat,caption:'',imageUrl:'',notes:'',created:false,posted:false});
  });
  return out;
}

      const appInst=fa.initializeApp(FIREBASE_CONFIG);
      db=fs.getFirestore(appInst);auth=authMod.getAuth(appInst);
      mode='cloud';
      authMod.onAuthStateChanged(auth,u=>{
        authChecked=true;user=u;unsubs.forEach(f=>f());unsubs=[];
        if(u){
          const bad=err=>banner('Firestore says: '+esc(err.message)+'. Clio needs an account with role admin to read and save.',true);
          unsubs.push(fs.onSnapshot(fs.collection(db,COL_POSTS),snap=>{posts=snap.docs.map(d=>({id:d.id,...d.data()}));render();},bad));
          unsubs.push(fs.onSnapshot(fs.collection(db,COL_LIB),snap=>{libOv={};snap.docs.forEach(d=>libOv[d.id]=d.data());render();},bad));
          unsubs.push(fs.onSnapshot(fs.collection(db,'gig_schedule'),snap=>{gigs=snap.docs.map(d=>({id:d.id,...d.data()}));render();},err=>console.warn('gig_schedule:',err.message)));
          setTimeout(()=>syncBuffer(false),5000);setTimeout(()=>{if(mode==='cloud'&&posts.length)migrateTitles();},3500);
        }else{posts=[];libOv={};gigs=[];}
        render();
      });
    }catch(e){mode='local';banner('Firebase failed to load ('+esc(e.message)+'). Running in this-browser-only mode.',true);}
  }
  if(mode==='local'){
    posts=JSON.parse(localStorage.getItem(LS)||'[]');
    libOv=JSON.parse(localStorage.getItem(LS_LIB)||'{}');
  }
  const m=$('mode');
  m.textContent=mode==='cloud'?'Synced · belladonna-hq':'This browser only';
  m.className='mode '+(mode==='cloud'?'cloud':'local');
  render();
}

  else localStorage.setItem(LS,JSON.stringify(posts));

}
async function removePost(id){

async function saveLib(id,patch){
  libOv[id]={...(libOv[id]||{}),...patch};
  if(mode==='cloud')await fs.setDoc(fs.doc(db,COL_LIB,id),libOv[id]);
  else localStorage.setItem(LS_LIB,JSON.stringify(libOv));
  toast('Saved');
}
async function seedMissing(){
  const have=new Set(posts.map(p=>p.id));
  const add=buildSeed().filter(s=>!have.has(s.id));
  if(!add.length){toast('Nothing missing');return;}
  if(mode==='cloud'){
    for(let i=0;i<add.length;i+=400){
      const b=fs.writeBatch(db);
      add.slice(i,i+400).forEach(({id,...rest})=>b.set(fs.doc(db,COL_POSTS,id),rest));
      await b.commit();
    }
  }else{
    posts=posts.concat(add);
    localStorage.setItem(LS,JSON.stringify(posts));
    render();
  }
  toast(add.length+' posts added');
}

/* ── HQ NIGHTS: HQ's gig_schedule is the source (the Planner mirrors it), so Clio reads it directly ── */
function t24(t){
  if(t==null||t==='')return '';
  const m=/^\s*(\d{1,2})(?::(\d{2}))?\s*([ap])?\.?m?\.?/i.exec(String(t));if(!m)return '';
  let h=+m[1];const ap=(m[3]||'').toLowerCase();
  if(ap==='p'&&h<12)h+=12;if(ap==='a'&&h===12)h=0;
  if(!ap&&m[1].length===1&&h>=1&&h<=11)h+=12;
  if(h>23)return '';
  return pad(h)+':'+(m[2]||'00');
}
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const isPublicGig=g=>g.date&&g.status!=='cancelled'&&!/event/i.test(g.kind||'');
function virtualRows(){
  if(!gigs.length)return [];
  const have=new Set(posts.map(p=>p.id)),from=addDays(todayStr(),-1),out=[];
  gigs.forEach(g=>{
    if(!isPublicGig(g)||g.date<from)return;
    const v=g.venue||'venue',k=g.kind||'night',t=t24(g.time);
    const mk=(code,date,time,type,title)=>{
      const id='g_'+g.id+'_'+code;if(have.has(id))return;
      out.push({id,date,time,type,title,platform:TYPES[type].plat,caption:'',imageUrl:'',notes:(g.host&&g.host!=='Unassigned')?'Host: '+g.host:'',created:false,posted:false,auto:true});
    };
    mk('tonight',g.date,'15:00','tonight','Tonight story: '+v+', '+k+(t?' at '+fmtTime(t):''));
    mk('host',g.date,t||'18:00','host','Host story: '+v+', '+k);
    mk('best',addDays(g.date,1),'10:00','best','Best Dressed photo: '+v+', '+k+' ('+DN[new Date(g.date+'T12:00:00').getDay()]+')');
  });
  return out;
}
function nightLines(from,to,perDate){
  const L=gigs.filter(g=>isPublicGig(g)&&g.date>=from&&g.date<=to);
  const dow=g=>new Date(g.date+'T12:00:00').getDay();
  if(perDate)return L.sort((a,b)=>a.date<b.date?-1:1).map(g=>DN[dow(g)]+', '+g.venue+', '+g.kind);
  const m=new Map();
  L.forEach(g=>{const key=dow(g)+'|'+g.venue+'|'+g.kind;if(!m.has(key))m.set(key,{d:dow(g),v:g.venue,k:g.kind});});
  return [...m.values()].sort((a,b)=>a.d-b.d||String(a.v).localeCompare(String(b.v))).map(x=>DN[x.d]+', '+x.v+', '+x.k);
}

function rowHtml(p){
  const T=TYPES[p.type]||TYPES.other,mile=isMile(p),hi=['monthly','big','cover'].includes(p.type)?' hi':'';
  const checks=mile?'<div class="ck" style="visibility:hidden"></div>':
    `<div class="ck"><input type="checkbox" data-k="created" ${p.created?'checked':''}/>Made</div><div class="ck"><input type="checkbox" data-k="posted" ${p.posted?'checked':''}/>Posted</div>`;
  const has=(p.caption?'✎ ':'')+(p.imageUrl?'🖼':'');
  return `<div class="row ${mile?'milestone':''} ${p.posted?'done':''} ${overdue(p,todayStr())?'od':''}" data-id="${esc(p.id)}">${checks}<div class="time">${fmtTime(p.time)||'—'}</div><span class="badge${hi}">${T.l}</span><div class="rt">${esc(p.title)}${p.notes?`<small>${esc(p.notes)}</small>`:''}</div><div class="has">${has}</div>${p.auto?'':`<button class="btn btn-d" style="padding:3px 9px" data-act="delrow" data-arg="${esc(p.id)}" title="Delete this post">✕</button>`}</div>`;
}
function groupedList(list,monthHeads,desc){
  if(!list.length)return '<div class="empty">Nothing here.</div>';
  const t=todayStr();let html='',curM='',curD='';
  list.forEach(p=>{
    const m=p.date.slice(0,7);
    if(monthHeads&&m!==curM){curM=m;html+=(curD?'</div>':'')+`<div class="monthh">${monthName(m)}</div>`;curD='';}
    if(p.date!==curD){
      if(curD)html+='</div>';
      curD=p.date;
      const tag=p.date===t?'<span class="tag today">Today</span>':(p.date<t&&list.some(x=>x.date===p.date&&overdue(x,t))?'<span class="tag od">Overdue</span>':'');
      html+=`<div class="day"><div class="dayh">${dayName(p.date)} ${tag}</div>`;
    }
    html+=rowHtml(p);
  });
  return html+'</div>';
}
function statsHtml(list,t){
  const real=list.filter(p=>!isMile(p));
  return `<div class="stats"><div class="stat"><b>${real.length}</b><span>Showing</span></div><div class="stat"><b>${real.filter(p=>p.created).length}</b><span>Made</span></div><div class="stat"><b>${real.filter(p=>p.posted).length}</b><span>Posted</span></div><div class="stat ${vposts.some(p=>overdue(p,t))?'bad':''}"><b>${vposts.filter(p=>overdue(p,t)).length}</b><span>Overdue (all)</span></div></div>`;
}

const evTitle=p=>p.title.replace(/^Big night:\s*/i,'');
function upcomingEvents(){const t=todayStr();return posts.filter(p=>p.type==='big'&&p.date>=t).sort(sortFn);}
function daysAway(d){const n=Math.round((new Date(d+'T12:00:00')-new Date(todayStr()+'T12:00:00'))/864e5);return n===0?'Today':n===1?'Tomorrow':n+' days away';}
function getSets(){const s=(libOv.eventTasks||{}).sets;return (s&&Object.keys(s).length)?s:{default:{name:'Big night',tasks:EVENT_TASKS}};}
function setFor(p){const S=getSets();return S[p.evKind]||S[Object.keys(S)[0]];}
function evChecklist(p){
  const t=todayStr(),tk=p.tasks||{};let lastG='';
  return setFor(p).tasks.map(x=>{
    const due=addDays(p.date,-x.d),done=!!tk[x.k],late=!done&&due<t;
    const g=x.g&&x.g!==lastG?`<div class="lbl" style="margin:10px 0 2px">${esc(x.g)}</div>`:'';lastG=x.g||'';
    const label=x.g?x.t.replace(/^Make event flyer:\s*/,''):x.t;
    return g+`<div class="row ${done?'done':''} ${late?'od':''}" style="cursor:pointer;${x.g?'margin-left:14px;':''}" data-act="task" data-arg="${esc(p.id)}|${x.k}"><input type="checkbox" ${done?'checked':''} style="pointer-events:none"/><div class="rt">${esc(label)}</div><div class="has" style="display:block">${done?'Done':(late?'Overdue · ':'Do by ')+(late?'':'')+new Date(due+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>`;
  }).join('');
}
function evProgress(p){const L=setFor(p).tasks,n=L.filter(x=>(p.tasks||{})[x.k]).length;return [n,L.length];}

          <div class="monthh" style="margin:2px 0;border:0;padding:0">${esc(evTitle(p))}</div>
          <div class="meta" style="margin:0">${esc(dayName(p.date))}</div></div>
        <button class="btn btn-g" data-act="evnext" ${evIdx>=evs.length-1?'disabled style="opacity:.3"':''}>›</button>
      </div>

      <div class="acts" style="margin-top:12px"><button class="btn btn-g" data-act="edtasks">Edit checklists</button><button class="btn btn-g" data-act="evopen" data-arg="${esc(p.id)}">Edit event</button><button class="btn btn-p" data-act="tab" data-arg="events">See all events</button></div>

function vEvents(){
  const evs=upcomingEvents();

    `<div class="bar"><button class="btn btn-g" data-act="tab" data-arg="dashboard">‹ Back to Dashboard</button><button class="btn btn-g" data-act="edtasks">Edit checklists</button></div>`+

      <div class="prog"><i style="width:${Math.round(n/tot*100)}%"></i></div><div class="meta">${n} of ${tot} done</div>${evChecklist(p)}
      <div class="acts" style="margin-top:8px"><button class="btn btn-g" data-act="evopen" data-arg="${esc(p.id)}">Edit event</button></div></div>`;}).join('')+`</div>`:'<div class="empty">No upcoming big nights.</div>');

function overviewStats(){
  const t=todayStr(),wk=addDays(t,7),real=vposts.filter(p=>!isMile(p));
  const od=real.filter(p=>overdue(p,t)).length;
  const next=real.filter(p=>p.date>=t&&p.date<=wk&&!p.posted);
  const mp=real.filter(p=>p.date.startsWith(t.slice(0,7)));
  return `<div class="stats"><div class="stat ${od?'bad':''}"><b>${od}</b><span>Overdue</span></div><div class="stat"><b>${next.length}</b><span>Next 7 days</span></div><div class="stat"><b>${next.filter(p=>!p.created).length}</b><span>Still to make</span></div><div class="stat"><b>${mp.filter(p=>p.posted).length}/${mp.length}</b><span>Posted this month</span></div></div><div class="bar" style="margin-top:-6px"><button class="btn btn-g" data-act="bufsync">Sync with Buffer</button></div>`;
}

function isFeedIG(p){return !isMile(p)&&/IG/.test(p.platform||'')&&!/Story/.test(p.platform||'');}
function gridTile(p){
  return `<div class="gt ${p.posted?'live':''}" data-id="${esc(p.id)}" title="${esc(p.title)}">${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="" loading="lazy" onerror="this.style.display='none'"/>`:''}
    <div class="gtl"><span class="badge hi">${esc(TYPES[p.type]?.l||p.type)}</span><span>${esc(p.title)}</span></div>
    <div class="gtd">${new Date(p.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}${p.imageUrl?'':' · no image yet'}</div></div>`;
}
function vGrid(){
  const t=todayStr();
  const nextN=vposts.filter(p=>isFeedIG(p)&&!p.posted&&p.date>=t).sort(sortFn).slice(0,9);
  const live=vposts.filter(p=>isFeedIG(p)&&p.posted).sort((a,b)=>sortFn(b,a)).slice(0,9);
  const newestFirst=nextN.slice().reverse();
  $('view').innerHTML=head('Calendar','How your next nine feed posts will look on Instagram. Newest sits top-left, like the real grid.')+overviewStats()+
    `<div class="bar">${modeChips()}</div>`+
    `<div class="sec">Your next ${nextN.length} posts, as they will appear</div>`+
    (nextN.length?`<div class="ggrid">${newestFirst.map(gridTile).join('')}</div>`:'<div class="empty">No upcoming Instagram feed posts.</div>')+
    (live.length?`<div class="sec">Already live (your last ${live.length} posted)</div><div class="ggrid" style="opacity:.75">${live.map(gridTile).join('')}</div>`:'');
}

/* ── CALENDAR (History lives here) ── */
function modeChips(){return `<button class="chip ${calMode==='list'?'on':''}" data-act="calmode" data-arg="list">List</button><button class="chip ${calMode==='month'?'on':''}" data-act="calmode" data-arg="month">Month</button><button class="chip ${calMode==='grid'?'on':''}" data-act="calmode" data-arg="grid">Instagram grid</button><span style="width:8px"></span>`;}
function vMonth(){
  const t=todayStr(),[Y,M]=calMonth.split('-').map(Number);
  const startDow=new Date(Y,M-1,1).getDay(),dim=new Date(Y,M,0).getDate(),cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(Y+'-'+pad(M)+'-'+pad(d));
  while(cells.length%7)cells.push(null);
  let list=vposts.slice();if(typeF!=='all')list=list.filter(p=>p.type===typeF);
  const by={};list.forEach(p=>{(by[p.date]=by[p.date]||[]).push(p);});
  Object.values(by).forEach(a=>a.sort(sortFn));
  const monthTitle=new Date(Y,M-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const grid=cells.map(ds=>{
    if(!ds)return '<div class="mc out"></div>';
    const ps=by[ds]||[];
    const chips=ps.slice(0,3).map(p=>`<span class="mp ${isMile(p)?'big':p.posted?'done':overdue(p,t)?'od':''}" title="${esc(p.title)}">${isMile(p)?'★ ':''}${esc(TYPES[p.type]?.l||p.type)}</span>`).join('');
    return `<div class="mc ${ds===t?'today':''} ${ds===selDay?'sel':''}" data-act="day" data-arg="${ds}"><div class="md">${+ds.slice(8)}</div>${chips}${ps.length>3?`<span class="mp more">+${ps.length-3}</span>`:''}</div>`;
  }).join('');
  const sel=selDay&&selDay.startsWith(calMonth)?(by[selDay]||[]):null;
  $('view').innerHTML=head('Calendar','Tap a day to see its posts. Gold = to do, green = posted, red = overdue, ★ = big night.')+overviewStats()+
    `<div class="bar">${modeChips()}<select class="mini" id="tf"><option value="all">All templates</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${typeF===k?'selected':''}>${v.l}</option>`).join('')}</select></div>`+
    `<div class="mnav"><button class="btn btn-g" data-act="mprev">‹</button><div class="mt">${monthTitle}</div><button class="btn btn-g" data-act="mtoday">Today</button><button class="btn btn-g" data-act="mnext">›</button></div>`+
    `<div class="mgrid">${DN.map(d=>`<div class="mh">${d}</div>`).join('')}${grid}</div>`+
    (sel?`<div class="sec">${dayName(selDay)}</div>${sel.length?sel.map(rowHtml).join(''):'<div class="empty">Nothing on this day.</div>'}<div style="margin-top:8px"><button class="btn btn-g" data-act="newday" data-arg="${selDay}">+ Add post on this day</button></div>`:'');
}
function vCalendar(){
  if(calMode==='month'){vMonth();return;}
  if(calMode==='grid'){vGrid();return;}
  const t=todayStr();
  const months=[...new Set(vposts.map(p=>p.date.slice(0,7)))].sort();
  const views=[['todo','To do'],['overdue','Overdue'],['all','Everything'],['history','History']];
  let list=vposts.slice();
  if(typeF!=='all')list=list.filter(p=>p.type===typeF);
  if(monthF!=='all')list=list.filter(p=>p.date.startsWith(monthF));
  const end=addDays(t,14);
  if(calView==='todo')list=list.filter(p=>overdue(p,t)||(p.date>=t&&p.date<=end&&!p.posted));
  if(calView==='overdue')list=list.filter(p=>overdue(p,t));
  if(calView==='history')list=list.filter(p=>p.posted);
  list.sort(sortFn);
  if(calView==='history')list.reverse();
  $('view').innerHTML=head('Calendar',calView==='history'?'Everything that has gone out.':'Check “Made” when the graphic exists, “Posted” when it is live.')+overviewStats()+
    
    `<div class="bar">${modeChips()}${views.map(([k,l])=>`<button class="chip ${calView===k?'on':''}" data-act="view" data-arg="${k}">${l}</button>`).join('')}
      <select class="mini" id="tf"><option value="all">All templates</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${typeF===k?'selected':''}>${v.l}</option>`).join('')}</select>
      <select class="mini" id="mf"><option value="all">All months</option>${months.map(m=>`<option value="${m}" ${monthF===m?'selected':''}>${monthName(m)}</option>`).join('')}</select></div>`+
    (calView==='todo'?groupedList(list,false):groupedList(list,calView!=='history'));
}

/* ── ECHO ── */
let echoF='need';
function engage(p){const s=p.stats||{};return (+s.likes||0)+(+s.comments||0)+(+s.shares||0);}
function quietSave(p){
  const i=posts.findIndex(x=>x.id===p.id);if(i>=0)posts[i]=p;else posts.push(p);
  if(mode==='cloud'){const{id,...rest}=p;fs.setDoc(fs.doc(db,COL_POSTS,id),rest);}else localStorage.setItem(LS,JSON.stringify(posts));
}
function vEcho(){
  const t=todayStr(),since=addDays(t,-60);
  const done=posts.filter(p=>p.posted&&!isMile(p)&&p.date>=since).sort((a,b)=>sortFn(b,a));
  const hasStats=p=>p.stats&&(p.stats.reach||p.stats.likes||p.stats.comments||p.stats.shares);
  const withS=posts.filter(p=>!isMile(p)&&hasStats(p));
  const list=echoF==='need'?done.filter(p=>!hasStats(p)):done;
  const sum=k=>withS.reduce((a,p)=>a+(+(p.stats||{})[k]||0),0);
  const best=withS.slice().sort((a,b)=>engage(b)-engage(a))[0];
  const by={};withS.forEach(p=>{const k=p.type;(by[k]=by[k]||{n:0,reach:0,eng:0});by[k].n++;by[k].reach+=+(p.stats.reach)||0;by[k].eng+=engage(p);});
  const rows=Object.entries(by).map(([k,v])=>({k,n:v.n,reach:Math.round(v.reach/v.n),eng:Math.round(v.eng/v.n)})).sort((a,b)=>b.eng-a.eng);
  const mx=Math.max(1,...rows.map(x=>x.eng));
  const num=(p,f,l)=>`<div style="width:78px"><div class="lbl" style="margin:0 0 2px">${l}</div><input type="text" inputmode="numeric" data-stat="${esc(p.id)}" data-f="${f}" value="${(p.stats||{})[f]||''}" style="padding:5px 7px"/></div>`;
  $('view').innerHTML=head('Echo','Type in each post\'s numbers from Instagram or Buffer. Echo shows which templates do best.')+
    `<div class="stats"><div class="stat"><b>${withS.length}</b><span>Posts with numbers</span></div><div class="stat"><b>${sum('reach').toLocaleString()}</b><span>Total reach</span></div><div class="stat"><b>${sum('likes').toLocaleString()}</b><span>Likes</span></div><div class="stat"><b>${(sum('comments')+sum('shares')).toLocaleString()}</b><span>Comments + shares</span></div></div>`+
    (best?`<div class="banner">Best post so far: <b>${esc(best.title)}</b> (${esc(dayName(best.date))}) with ${engage(best).toLocaleString()} likes, comments and shares.</div>`:'')+
    (rows.length?`<div class="sec">Average per template</div><div class="card">${rows.map(x=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="width:90px" class="nick">${esc(TYPES[x.k]?.l||x.k)} (${x.n})</div><div class="prog" style="flex:1;margin:0"><i style="width:${Math.round(x.eng/mx*100)}%"></i></div><div class="has" style="display:block;width:150px;text-align:right">${x.eng} engaged · ${x.reach} reach</div></div>`).join('')}</div>`:'')+
    `<div class="sec">Enter results</div><div class="bar"><button class="chip ${echoF==='need'?'on':''}" data-act="echof" data-arg="need">Needs numbers (${done.filter(p=>!hasStats(p)).length})</button><button class="chip ${echoF==='all'?'on':''}" data-act="echof" data-arg="all">All posted, last 60 days</button></div>`+
    (list.length?list.map(p=>`<div class="row" style="cursor:default;flex-wrap:wrap" data-id="${esc(p.id)}"><div class="time" style="width:70px">${new Date(p.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div><span class="badge">${esc(TYPES[p.type]?.l||p.type)}</span><div class="rt" style="min-width:160px">${esc(p.title)}</div>${num(p,'reach','Reach')}${num(p,'likes','Likes')}${num(p,'comments','Comments')}${num(p,'shares','Shares')}</div>`).join(''):'<div class="empty">'+(echoF==='need'?'Every posted post in the last 60 days has numbers. Nice.':'Nothing posted in the last 60 days yet.')+'</div>');
}

const MONTHLY_SET=[['mcover','Slide 1 of 3'],['monthly','Slide 2 of 3'],['sched','Slide 3 of 3']];

function orderGroups(g){const ix=x=>{const i=GROUP_ORDER.indexOf(x);return i<0?99:i;};return g.slice().sort((a,b)=>ix(a)-ix(b));}

  groups.map(g=>`<div class="monthh" style="font-size:1.1rem;margin:14px 0 6px">${esc(g)}</div>`+
    L.filter(e=>(e.group||'Other')===g).map(e=>`<div class="card" style="padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">

/* ── CLIO API (Cloudflare Worker): ChatGPT captions + R2 image upload ── */
function normApi(v){
  let u=String(v||'').trim();
  const m=u.match(/https?:\/\/[^\s)\]]+/);if(m)u=m[0];
  else if(/^[\w.-]+\.workers\.dev/i.test(u))u='https://'+u;
  u=u.replace(/\/+$/,'');
  return /^https:\/\/[\w.-]+\.[a-z]{2,}$/i.test(u)?u:'';
}
function apiBase(){
  let u='';try{u=localStorage.getItem('bn_clio_api')||'';}catch(e){}
  if(!u){
    u=normApi(prompt('Paste your Clio Worker address (like https://clio-api.yourname.workers.dev). One time only.')||'');
    if(!u)return '';
    try{localStorage.setItem('bn_clio_api',u);}catch(e){}
  }
  return u;
}
async function apiFetch(path,opts){
  const base=apiBase();if(!base)throw new Error('No Worker address set');
  if(!user)throw new Error('Sign in first');
  const tok=await user.getIdToken();
  const res=await fetch(base+path,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+tok}});
  const d=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(d.error||('Error '+res.status));
  return d;
}

function shrink(file,max){return new Promise((ok,no)=>{
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const m=max||1600,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Could not read image')),'image/jpeg',.9);};
  im.onerror=()=>no(new Error('Could not read image'));im.src=u;});}
async function uploadImg(inp){

function gfxDefaults(type,title,date){
  const t=title.includes(': ')?title.split(': ').slice(1).join(': '):title;
  const ev=t.replace(/^\d+ days?: /,'');
  const d={kicker:'BELLADONNA PRESENTS',title:ev.toUpperCase(),sub:'',lines:'',foot:'belladonnanights.com'};
  if(type==='weekly'){d.kicker='THIS WEEK AT BELLADONNA';d.lines=(gigs.length&&date?nightLines(date,addDays(date,6),true):[]).join('\n');}
  else if(type==='monthly'){const dt=new Date((date||todayStr())+'T12:00:00');dt.setMonth(dt.getMonth()+1);d.title=dt.toLocaleDateString('en-US',{month:'long'}).toUpperCase();d.sub=t;}
  else if(type==='count'){const m=title.match(/^Countdown, (.*?): (.*)$/);d.kicker='BELLADONNA COUNTDOWN';d.title=m?(m[1]==='day of'?'TONIGHT':m[1].toUpperCase()):'COUNTDOWN';d.sub=m?m[2]:ev;}
  else if(type==='recap'){d.kicker='BELLADONNA RECAP';d.sub='CROWN WINNERS';d.lines=(date?winLines(date.slice(0,7),false):[]).join('\n');}
  else if(type==='tonight'){d.kicker='TONIGHT AT BELLADONNA';}
  return d;
}

function loadImg(src,cors){return new Promise(ok=>{const im=new Image();if(cors)im.crossOrigin='anonymous';im.onload=()=>ok(im);im.onerror=()=>ok(null);im.src=src;});}

}
async function gfxPick(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  gfxBg=await loadImg(URL.createObjectURL(f),false);gfxBg&&(gfxBg._file=f);gfxDraw();
}
function wrapText(c,txt,max){
  const w=txt.split(/\s+/),out=[];let cur='';
  w.forEach(x=>{const t=cur?cur+' '+x:x;if(c.measureText(t).width>max&&cur){out.push(cur);cur=x;}else cur=t;});
  if(cur)out.push(cur);return out;
}
function gfxDraw(){
  const cv=$('g-cv'),c=cv.getContext('2d'),W=cv.width,H=cv.height,gold='#c9a96e',cream='#f0ece0';
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  if(gfxBg){const k=Math.max(W/gfxBg.width,H/gfxBg.height),w=gfxBg.width*k,h=gfxBg.height*k;c.drawImage(gfxBg,(W-w)/2,(H-h)/2,w,h);}
  const dk=+$('g-dark').value;if(dk){c.fillStyle=`rgba(0,0,0,${dk})`;c.fillRect(0,0,W,H);}
  c.strokeStyle='rgba(201,169,110,.55)';c.lineWidth=Math.max(2,W/360);const m=W*.04;c.strokeRect(m,m,W-2*m,H-2*m);
  c.textAlign='center';c.textBaseline='alphabetic';
  const maxW=W*.78,u=W/1080,blocks=[];
  const kick=$('g-kick').value.trim(),title=$('g-title').value.trim(),sub=$('g-sub').value.trim(),foot=$('g-foot').value.trim();
  const lines=$('g-lines').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(kick)blocks.push({f:`600 ${30*u}px Cinzel`,col:gold,t:[kick.toUpperCase()],lh:44*u,sp:6*u,gap:26*u});
  if(title){let fs=190*u,L;for(;fs>50*u;fs-=8*u){c.font=`400 ${fs}px "Bebas Neue"`;L=wrapText(c,title,maxW);if(L.length<=2&&L.every(l=>c.measureText(l).width<=maxW))break;}
    blocks.push({f:`400 ${fs}px "Bebas Neue"`,col:gold,t:L,lh:fs*1.0,sp:fs*.03,gap:22*u});}
  if(sub)blocks.push({f:`italic 400 ${46*u}px "EB Garamond"`,col:cream,t:(c.font=`italic 400 ${46*u}px "EB Garamond"`,wrapText(c,sub,maxW)),lh:58*u,sp:0,gap:30*u});
  if(lines.length){const fs=lines.length>7?28*u:34*u;blocks.push({f:`400 ${fs}px "DM Sans"`,col:cream,t:lines.flatMap(l=>(c.font=`400 ${fs}px "DM Sans"`,wrapText(c,l,maxW))),lh:fs*1.6,sp:1*u,gap:30*u});}
  const total=blocks.reduce((a,b)=>a+b.t.length*b.lh+b.gap,0);
  const pos=$('g-pos').value,top=pos==='top'?H*.12:pos==='bot'?H*.88-total:(H-total)/2;
  let y=top;
  blocks.forEach(b=>{c.font=b.f;c.fillStyle=b.col;if('letterSpacing' in c)c.letterSpacing=b.sp+'px';
    c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=12*u;
    b.t.forEach(l=>{y+=b.lh;c.fillText(l,W/2,y-b.lh*.2);});y+=b.gap;});
  c.shadowBlur=0;if('letterSpacing' in c)c.letterSpacing=(3*u)+'px';
  if(foot){c.font=`600 ${24*u}px Cinzel`;c.fillStyle=gold;c.fillText(foot,W/2,H-m-28*u);}
  if('letterSpacing' in c)c.letterSpacing='0px';
}
async function gfxSaveBg(){
  if(!gfxBg){toast('Choose a background first');return;}
  const b=$('g-savebg');b.disabled=true;b.textContent='Saving…';
  try{
    let blob;
    if(gfxBg._file)blob=await shrink(gfxBg._file,2000);
    else{const t=document.createElement('canvas');t.width=gfxBg.width;t.height=gfxBg.height;t.getContext('2d').drawImage(gfxBg,0,0);blob=await new Promise(o=>t.toBlob(o,'image/jpeg',.9));}
    const d=await apiFetch('/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});
    await saveLib(gfxType,{bgUrl:d.url});toast('Saved as the template background');
  }catch(e){toast('Save failed: '+e.message);}
  b.disabled=false;b.textContent='Save as template background';
}
async function gfxUse(){
  const b=$('g-use');b.disabled=true;b.textContent='Uploading…';
  try{
    const blob=await new Promise((ok,no)=>{try{$('g-cv').toBlob(x=>x?ok(x):no(new Error('Could not export')),'image/jpeg',.92);}catch(e){no(new Error('Background blocked by the browser, re-choose it from your computer'));}});
    const d=await apiFetch('/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});
    $('f-img').value=d.url;imgPrev();$('gov').classList.remove('show');toast('Graphic added to the post');
  }catch(e){toast('Failed: '+e.message);}

}

/* ── BEST DRESSED WINNERS (feed the Monthly Recap) ── */
function winMap(){return (libOv.winners||{}).map||{};}
function winSlots(month){
  const wk=posts.filter(p=>p.type==='weekly'&&p.date.startsWith(month)&&/^Weekly graphic:/.test(p.title)).sort(sortFn)
    .map((p,i)=>({key:p.id,label:'Week '+(i+1)+': '+p.title.replace(/^Weekly graphic:\s*/,'')}));
  const big=posts.filter(p=>p.type==='big'&&p.date.startsWith(month)).sort(sortFn).map(p=>({key:p.id,label:'Finale: '+evTitle(p)}));
  return wk.concat(big);
}
function winLines(month,fillBlanks){
  const m=winMap();
  return winSlots(month).map(x=>(m[x.key]||'').trim()?x.label+' - '+m[x.key].trim():(fillBlanks?x.label+' - [WINNER]':'')).filter(Boolean);
}
async function setWin(key,val){
  const m={...winMap()};if(val.trim())m[key]=val.trim();else delete m[key];
  await saveLib('winners',{map:m});renderWin();
}
function renderWin(){
  const box=$('f-win');if(!box)return;
  const type=$('f-type').value,date=$('f-date').value,m=winMap();
  let slots=[],title='';
  if(type==='recap'&&date){slots=winSlots(date.slice(0,7));title='Best Dressed winners for this month (fills the recap)';}
  else if(type==='weekly'&&editingId&&/^Weekly graphic:/.test($('f-title').value)){slots=[{key:editingId,label:'This week'}];title='Best Dressed winner this week (feeds the monthly recap)';}
  if(!slots.length){box.style.display='none';box.innerHTML='';return;}
  box.style.display='';
  box.innerHTML=`<label>${title}</label>`+slots.map(x=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="has" style="display:block;width:44%;flex-shrink:0;white-space:normal">${esc(x.label)}</span><input type="text" value="${esc(m[x.key]||'')}" placeholder="Winner name" data-k="${esc(x.key)}" onchange="setWin(this.dataset.k,this.value)"/></div>`).join('');
}

/* ── TAG SETS: saved hashtags and @tags per venue / game ── */
function getTagSets(){return (libOv.tagSets||{}).sets||{};}
async function saveTagSets(sets){await saveLib('tagSets',{sets});render();}
function tagSuggested(set){const hay=($('f-title').value+' '+$('f-notes').value).toLowerCase();return set.name&&hay.includes(set.name.toLowerCase());}
function renderTags(){
  const box=$('f-tags');if(!box)return;
  const L=Object.entries(getTagSets()).filter(([,v])=>(v.text||'').trim());
  if(!L.length){box.innerHTML='<span class="has" style="display:block">Add tag sets in the Library to add hashtags with one click.</span>';return;}
  L.sort((a,b)=>tagSuggested(b[1])-tagSuggested(a[1]));
  const sug=L.filter(([,v])=>tagSuggested(v));
  box.innerHTML=(sug.length>1?`<button class="chip on" type="button" onclick="addTags('*')">+ All matching (${sug.length})</button>`:'')+
    L.map(([k,v])=>`<button class="chip ${tagSuggested(v)?'on':''}" type="button" onclick="addTags('${k}')">+ ${esc(v.name)}</button>`).join('');
}
function addTags(id){
  const S=getTagSets();
  const picks=id==='*'?Object.values(S).filter(tagSuggested):[S[id]].filter(Boolean);
  const cap=$('f-cap');let have=cap.value.toLowerCase();
  const add=[];
  picks.forEach(v=>(v.text||'').split(/\s+/).filter(Boolean).forEach(t=>{if(!have.includes(t.toLowerCase())&&!add.some(a=>a.toLowerCase()===t.toLowerCase()))add.push(t);}));
  if(!add.length){toast('Those tags are already in the caption');return;}
  const cur=cap.value.trimEnd(),last=cur.split('\n').pop().trim();
  cap.value=cur?(/^[#@]/.test(last)?cur+' ':cur+'\n\n')+add.join(' '):add.join(' ');
  toast(add.length+' tag'+(add.length>1?'s':'')+' added');
}
function libTagsHtml(){
  const S=getTagSets(),ids=Object.keys(S);
  return `<div class="sec">Tag sets</div><div class="sub" style="margin:0 0 8px">Hashtags and @tags saved per venue and per game. In a post, one click adds them to the caption. A set lights up on its own when its name is in the post title (like Karaoke or a venue name).</div>
  <div class="bar"><button class="btn btn-g" data-act="tsnew">+ New set</button><button class="btn btn-g" data-act="tsgames">Add my games</button><button class="btn btn-g" data-act="tsvenues">Add my venues</button></div>
  <div class="grid">${ids.map(id=>{const v=S[id];return `<div class="card"><span class="lbl">Name (match the venue or game name)</span><input type="text" data-ts="${id}" data-f="name" value="${esc(v.name||'')}"/>
    <span class="lbl">Kind</span><select data-ts="${id}" data-f="kind">${['venue','game','general'].map(k=>`<option value="${k}" ${v.kind===k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select>
    <span class="lbl">Hashtags and @tags</span><textarea data-ts="${id}" data-f="text" style="min-height:70px" placeholder="#karaoke #tacoma @thevenue">${esc(v.text||'')}</textarea>
    <div class="acts"><button class="btn btn-d" data-act="tsdel" data-arg="${id}">Delete</button></div></div>`;}).join('')||'<div class="empty">No tag sets yet.</div>'}</div>`;
}
function tsAdd(names,kind){
  const S={...getTagSets()},have=new Set(Object.values(S).map(v=>(v.name||'').toLowerCase()));let n=0;
  names.forEach(nm=>{if(!nm||have.has(nm.toLowerCase()))return;S['t'+Date.now().toString(36)+(n++)]={name:nm,kind,text:''};have.add(nm.toLowerCase());});
  saveTagSets(S);toast(n?n+' added: fill in their tags':'Nothing new to add');
}

function twAdd(){tw[twKey].tasks.push({k:'t'+Date.now().toString(36),t:'New task',d:14});renderTasks();}
function twDelTask(i){tw[twKey].tasks.splice(i,1);renderTasks();}
function twMove(i,d){const L=tw[twKey].tasks,j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];renderTasks();}
function twNewSet(){const n=(prompt('Name for the new checklist (like Trivia night or Costume party)')||'').trim();if(!n)return;
  const k='s'+Date.now().toString(36);tw[k]={name:n,tasks:JSON.parse(JSON.stringify(tw[twKey].tasks)).map(x=>({...x,k:x.k}))};twKey=k;renderTasks();}
function twDelSet(){if(Object.keys(tw).length<2){toast('Keep at least one checklist');return;}
  if(!confirm('Delete the checklist "'+tw[twKey].name+'"? Events using it switch to another checklist.'))return;
  delete tw[twKey];twKey=Object.keys(tw)[0];renderTasks();}
async function twSave(){
  Object.values(tw).forEach(v=>{v.tasks=v.tasks.filter(x=>x.t.trim());v.name=v.name.trim()||'Checklist';});
  await saveLib('eventTasks',{sets:tw});$('tov').classList.remove('show');render();
}

/* ── BUFFER SYNC: Buffer says it sent a post, Clio ticks Posted ── */
let bufBusy=false;
async function migrateTitles(){
  if((libOv.migrations||{}).slides3)return;
  const L=posts.filter(p=>p.type==='monthly'&&/, 2 slides/.test(p.title));
  for(const p of L)await persist({...p,title:p.title.replace(', 2 slides',', 3 slides')});
  await saveLib('migrations',{slides3:true});
}

async function syncBuffer(manual){
  if(bufBusy)return;
  let stored='';try{stored=localStorage.getItem('bn_clio_api')||'';}catch(e){}
  if(!manual&&!stored)return;
  const t=todayStr();
  const cand=posts.filter(p=>!isMile(p)&&(p.caption||'').trim()&&!p.posted&&p.date<=addDays(t,1));
  if(!cand.length){if(manual)toast('Nothing is waiting to be marked posted');return;}
  bufBusy=true;
  try{
    const since=addDays(cand.map(p=>p.date).sort()[0],-1)+'T00:00:00Z';
    const d=await apiFetch('/buffer/sent?since='+encodeURIComponent(since),{method:'GET'});
    const norm=x=>String(x||'').replace(/\\s+/g,' ').trim().toLowerCase();
    const near=(p,b)=>Math.abs((new Date(ymd(new Date(b.dueAt))+'T12:00:00')-new Date(p.date+'T12:00:00'))/864e5)<=1;
    const same=(p,b)=>{const a=norm(p.caption),c=norm(b.text);return a===c||(a.length>40&&c.length>40&&a.slice(0,80)===c.slice(0,80));};
    let done=0,failed=0;
    for(const p of cand){
      if((d.sent||[]).some(b=>same(p,b)&&near(p,b))){await persist({...p,created:true,posted:true});done++;}
      else if((d.failed||[]).some(b=>same(p,b)&&near(p,b)))failed++;
    }
    if(done||failed||manual)toast((done?done+' marked posted from Buffer':'Nothing new from Buffer')+(failed?` · ${failed} failed in Buffer, check it`:''));
  }catch(e){if(manual)toast('Buffer sync failed: '+e.message);}
  bufBusy=false;
}

/* ── BUFFER CSV EXPORT (Buffer's bulk upload: Text, Image URL, Tags, Posting Time) ── */
function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"';}
function exportBuffer(){
  const t=todayStr();
  let list=posts.filter(p=>!isMile(p)&&p.type!=='tonight'&&p.type!=='host'&&!p.posted&&p.date>=t);
  const ready=list.filter(p=>p.caption.trim()).sort(sortFn);
  const skipped=list.length-ready.length;
  if(!ready.length){toast('No upcoming posts have a caption yet');return;}
  const rows=[['Text','Image URL','Tags','Posting Time'].map(csvCell).join(',')];
  ready.forEach(p=>rows.push([p.caption,p.imageUrl,'',`${p.date} ${p.time||'12:00'}`].map(csvCell).join(',')));
  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='clio-buffer-'+t+'.csv';document.body.appendChild(a);a.click();a.remove();
  toast(ready.length+' posts exported'+(skipped?` · ${skipped} skipped (no caption)`:''));
}
